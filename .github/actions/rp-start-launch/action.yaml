name: 'Report Portal Start Launch'
description: 'Start the Report Portal launch every chunk of one provider/OS reports into, with a suite for every test folder'

inputs:
  provider:
    description: 'Provider to test (e.g. docspaceEU, ncoc, ocis)'
    required: true
  os_name:
    description: 'Operating system the chunks run on (windows, linux, macos); the platform attribute of the launch'
    required: true
  os_config:
    description: 'OS-specific config file name the chunks run with'
    required: true
  suite:
    description: 'Test suite to run (optional)'
    required: false
    default: ''
  test_path:
    description: 'Path to specific test file or dir (optional, runs full suite if empty)'
    required: false
    default: ''
  project_name:
    description: 'Report Portal project name'
    required: true
  launch_name:
    description: 'Report Portal launch name'
    required: true
  report_key:
    description: 'Report Portal API key'
    required: true
  branch:
    description: 'Dep.Tests branch to checkout'
    required: false
    default: 'master'
  read_pat:
    description: 'GitHub PAT for private repository access'
    required: true
  url:
    description: 'Server URL to test against (optional; overrides testOptions.url in the OS config when set)'
    required: false
    default: ''

outputs:
  rp_url:
    description: 'ReportPortal launch URL'
    value: ${{ steps.start.outputs.rp_url }}

runs:
  using: 'composite'
  steps:
    - name: Checkout Dep.Tests repository
      uses: actions/checkout@v7
      with:
        repository: ONLYOFFICE-data/Dep.Tests
        path: Dep.Tests
        sparse-checkout: |
          puppeteer
          tools
        token: ${{ inputs.read_pat }}
        submodules: false
        fetch-depth: 1
        ref: ${{ inputs.branch }}

    - name: Cache Python 3.10 toolcache
      uses: actions/cache@v5
      with:
        path: ${{ runner.tool_cache }}/Python/3.10.*
        key: ${{ runner.os }}-${{ runner.arch }}-toolcache-python-3.10

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Cache Report Portal client
      id: cache-rp-modules
      uses: actions/cache@v5
      with:
        path: Dep.Tests/tools/report_portal/pip_modules
        key: ${{ runner.os }}-${{ runner.arch }}-rp-modules-${{ hashFiles('Dep.Tests/tools/report_portal/config.json') }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v5
      with:
        path: Dep.Tests/puppeteer/engine/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node24-modules-${{ hashFiles('Dep.Tests/puppeteer/engine/package-lock.json') }}

    - name: Install npm dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: Dep.Tests/puppeteer/engine
      run: npm ci --prefer-offline --no-audit

    - name: Configure Report Portal
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project_name }}
        LAUNCH_NAME: ${{ inputs.launch_name }}
        REPORT_API_KEY: ${{ inputs.report_key }}
      run: |
        node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('Dep.Tests/tools/report_portal/config.json', 'utf8'));
          config.api_key = process.env.REPORT_API_KEY;
          config.project_name = process.env.PROJECT_NAME;
          config.launch_name = process.env.LAUNCH_NAME;
          fs.writeFileSync('Dep.Tests/tools/report_portal/config.json', JSON.stringify(config, null, 2));
        "

    - name: Configure test server URL
      if: ${{ inputs.url != '' }}
      shell: bash
      working-directory: Dep.Tests/puppeteer
      env:
        OS_CONFIG: ${{ inputs.os_config }}
        SERVER_URL: ${{ inputs.url }}
      run: |
        node -e "
          const fs = require('fs');
          const file = process.env.OS_CONFIG;
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.testOptions = config.testOptions || {};
          config.testOptions.url = process.env.SERVER_URL + 'example';
          fs.writeFileSync(file, JSON.stringify(config, null, 2));
          console.log('Updated testOptions.url in ' + file);
        "

    - name: Start launch
      id: start
      shell: bash
      working-directory: Dep.Tests/puppeteer/engine
      env:
        PROVIDER: ${{ inputs.provider }}
        OS_NAME: ${{ inputs.os_name }}
        OS_CONFIG: ${{ inputs.os_config }}
        BRANCH: ${{ inputs.branch }}
        TEST_PATH: ${{ inputs.test_path }}
        SUITE: ${{ inputs.suite }}
      run: |
        TEST_PATH_ARG=""
        if [ -n "$TEST_PATH" ]; then
          TEST_PATH_ARG="$TEST_PATH"
        fi
        SUITE_ARG=""
        if [ -n "$SUITE" ]; then
          SUITE_ARG="--suite $SUITE"
        fi

        python run.py $TEST_PATH_ARG \
          --providers "$PROVIDER" \
          --config "$OS_CONFIG" \
          --platform "$OS_NAME" \
          --branch "$BRANCH" \
          --start-launch rp_launch.json $SUITE_ARG 2>&1 | tee output.log
        EXIT_CODE=${PIPESTATUS[0]}

        RP_URL=$(grep -oP 'RP_LAUNCH_URL=\K\S+' output.log | tail -n 1 || true)
        echo "rp_url=$RP_URL" >> $GITHUB_OUTPUT
        rm -f output.log
        exit $EXIT_CODE

    - name: Upload launch
      uses: actions/upload-artifact@v5
      with:
        name: rp-launch-${{ inputs.provider }}-${{ inputs.os_name }}
        path: Dep.Tests/puppeteer/engine/rp_launch.json
        retention-days: 2
        if-no-files-found: error
