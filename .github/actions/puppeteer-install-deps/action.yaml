name: 'Puppeteer Install Dependencies'
description: 'Install Python, Node.js, npm packages and Chrome once per run and populate the shared caches, so chunk jobs need no downloads'

inputs:
  read_pat:
    description: 'GitHub PAT for private repository access'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout Dep.Tests repository
      uses: actions/checkout@v7
      with:
        repository: ONLYOFFICE-data/Dep.Tests
        path: Dep.Tests
        sparse-checkout: |
          puppeteer
          tools
        token: ${{ inputs.read_pat }}
        submodules: false
        fetch-depth: 1

    - name: Cache Python 3.10 toolcache
      uses: actions/cache@v5
      with:
        path: ${{ runner.tool_cache }}/Python/3.10.*
        key: ${{ runner.os }}-${{ runner.arch }}-toolcache-python-3.10

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Cache Report Portal client
      id: cache-rp-modules
      uses: actions/cache@v5
      with:
        path: Dep.Tests/tools/report_portal/pip_modules
        key: ${{ runner.os }}-${{ runner.arch }}-rp-modules-${{ hashFiles('Dep.Tests/tools/report_portal/config.json') }}

    - name: Install Report Portal client
      if: steps.cache-rp-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: Dep.Tests/tools/report_portal
      run: python -c "from report_portal_launcher import ReportPortalLauncher; ReportPortalLauncher()"

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: Dep.Tests/puppeteer/engine/package-lock.json

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v5
      with:
        path: Dep.Tests/puppeteer/engine/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node24-modules-${{ hashFiles('Dep.Tests/puppeteer/engine/package-lock.json') }}

    - name: Install npm dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: Dep.Tests/puppeteer/engine
      run: npm ci --prefer-offline --no-audit

    - name: Cache Puppeteer browsers
      id: cache-puppeteer
      uses: actions/cache@v5
      with:
        path: ~/.cache/puppeteer
        key: ${{ runner.os }}-${{ runner.arch }}-puppeteer-chrome-${{ hashFiles('Dep.Tests/puppeteer/engine/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-puppeteer-chrome-

    - name: Install Chrome for Puppeteer
      if: steps.cache-puppeteer.outputs.cache-hit != 'true'
      shell: bash
      working-directory: Dep.Tests/puppeteer/engine
      run: npx puppeteer browsers install chrome

