name: 'Resolve Dep.Tests ref'
description: 'Dep.Tests tag of the release a document server runs, at its build or later, or the branch given instead'

inputs:
  server_url:
    description: 'Document server whose build selects the tag (unused when branch is set)'
    required: false
    default: ''
  label:
    description: 'What the server is (stand or provider), for the log and the run summary'
    required: true
  branch:
    description: 'Dep.Tests branch or tag to use as is, ignoring the server build'
    required: false
    default: ''
  read_pat:
    description: 'GitHub PAT that can read ONLYOFFICE-data/Dep.Tests'
    required: true

outputs:
  ref:
    description: 'Dep.Tests ref to check out'
    value: ${{ steps.resolve.outputs.ref }}

runs:
  using: 'composite'
  steps:
    - name: Resolve Dep.Tests ref - ${{ inputs.label }}
      id: resolve
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server_url }}
        LABEL: ${{ inputs.label }}
        BRANCH_INPUT: ${{ inputs.branch }}
        READ_PAT: ${{ inputs.read_pat }}
      run: |
        if [ -n "$BRANCH_INPUT" ]; then
          echo "$LABEL: branch input -> Dep.Tests ref '$BRANCH_INPUT'"
          echo "- $LABEL: \`$BRANCH_INPUT\` (branch input)" >> "$GITHUB_STEP_SUMMARY"
          echo "ref=$BRANCH_INPUT" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$SERVER_URL" ]; then
          echo "::error::$LABEL: no document server url to read the build from"
          exit 1
        fi

        # The editor reports its build as VersionNum="10.0.0.169" in app.js; the build tags of
        # Dep.Tests use the same numbering (v10.0.0.169). -L: the server redirects to a versioned path.
        APP_JS="${SERVER_URL%/}/web-apps/apps/documenteditor/main/app.js"
        APP_FILE="$RUNNER_TEMP/app-$RANDOM.js"
        curl -sSfL --retry 3 --max-time 60 "$APP_JS" -o "$APP_FILE"
        VERSION=$(grep -o -m1 'VersionNum="[0-9.]*"' "$APP_FILE" | head -n 1 | grep -o '[0-9][0-9.]*' || true)
        rm -f "$APP_FILE"
        if [ -z "$VERSION" ]; then
          echo "::error::$LABEL: no VersionNum in $APP_JS"
          exit 1
        fi
        RELEASE="${VERSION%.*}"
        BUILD="${VERSION##*.}"

        # Tests of the same release, built for this build or a later one: a later build of the same
        # release only adds fixes, a lower one or another release is a different editor.
        # Outside the workspace: the checkout of this repository leaves its GITHUB_TOKEN as an auth header
        # for github.com in the local git config, and that header would replace the PAT given here.
        TAGS=$(git -C "$RUNNER_TEMP" ls-remote --tags --refs "https://x-access-token:${READ_PAT}@github.com/ONLYOFFICE-data/Dep.Tests.git" \
          "refs/tags/v$RELEASE.*")
        TAG=$(sed 's#.*refs/tags/##' <<< "$TAGS" | { grep -E '^v[0-9]+(\.[0-9]+){3}$' || true; } \
          | awk -F. -v b="$BUILD" '$4 + 0 >= b + 0' | sort -V | head -n 1)
        if [ -z "$TAG" ]; then
          echo "::error::$LABEL runs build $VERSION, but Dep.Tests has no tag v$RELEASE.<build >= $BUILD> - tag the tests for this build"
          exit 1
        fi
        if [ "$TAG" != "v$VERSION" ]; then
          echo "::notice::$LABEL runs build $VERSION, Dep.Tests has no tag v$VERSION -> later build tag '$TAG' of the same release"
        fi
        echo "$LABEL: build $VERSION -> Dep.Tests tag '$TAG'"
        echo "- $LABEL: \`$TAG\` (server build $VERSION)" >> "$GITHUB_STEP_SUMMARY"
        echo "ref=$TAG" >> "$GITHUB_OUTPUT"
