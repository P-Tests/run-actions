name: 'Merge Report Portal Launches'
description: 'Merges multiple Report Portal launches into one'

inputs:
  os-name:
    description: 'Operating system name (windows, linux, macos)'
    required: true
  launch-uuids:
    description: 'JSON array of launch UUIDs to merge'
    required: true
  api-key:
    description: 'Report Portal API key'
    required: true
  project-name:
    description: 'Report Portal project name'
    required: true
  github-token:
    description: 'GitHub token for accessing private repository'
    required: true
  launch-name:
    description: 'Name for the merged launch'
    required: false
    default: 'Github Action All Tests'
  branch:
    description: 'Dep.Tests branch to checkout'
    required: false
    default: 'master'

outputs:
  rp_launch_url:
    description: 'ReportPortal merged launch URL'
    value: ${{ steps.merge.outputs.rp_url }}

runs:
  using: 'composite'
  steps:
    - name: Checkout Dep.Tests repository
      uses: actions/checkout@v7
      with:
        repository: ONLYOFFICE-data/Dep.Tests
        path: Dep.Tests
        sparse-checkout: |
          puppeteer
          tools
        token: ${{ inputs.github-token }}
        ref: ${{ inputs.branch }}
        submodules: false

    - name: Cache Python 3.10 toolcache
      uses: actions/cache@v5
      with:
        path: ${{ runner.tool_cache }}/Python/3.10.*
        key: ${{ runner.os }}-${{ runner.arch }}-toolcache-python-3.10

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Cache Report Portal client
      id: cache-rp-modules
      uses: actions/cache@v5
      with:
        path: Dep.Tests/tools/report_portal/pip_modules
        key: ${{ runner.os }}-${{ runner.arch }}-rp-modules-${{ hashFiles('Dep.Tests/tools/report_portal/config.json') }}

    - name: Configure and Merge Launches
      id: merge
      shell: bash
      working-directory: Dep.Tests/tools/report_portal
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
        OS_NAME: ${{ inputs.os-name }}
        LAUNCH_NAME: ${{ inputs.launch-name }}
        UUIDS_JSON: ${{ inputs.launch-uuids }}
        REPORT_API_KEY: ${{ inputs.api-key }}
      run: |
        node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config.json', 'utf8'));
          config.api_key = process.env.REPORT_API_KEY;
          config.project_name = process.env.PROJECT_NAME;
          fs.writeFileSync('config.json', JSON.stringify(config, null, 2));
        "

        UUIDS="$UUIDS_JSON"

        if [ -z "$UUIDS" ] || [ "$UUIDS" = "[]" ] || [ "$UUIDS" = "null" ]; then
          echo "No UUIDs for $OS_NAME, skipping merge"
          echo "rp_url=" >> $GITHUB_OUTPUT
          exit 0
        fi

        if ! echo "$UUIDS" | jq empty 2>/dev/null; then
          echo "Invalid JSON format for $OS_NAME UUIDs"
          exit 1
        fi

        UUID_COUNT=$(echo "$UUIDS" | jq '. | length')

        if [ "$UUID_COUNT" -le 1 ]; then
          echo "Only $UUID_COUNT UUID(s) for $OS_NAME, merge not needed"
          echo "rp_url=" >> $GITHUB_OUTPUT
          exit 0
        fi

        UUID_LIST=$(echo "$UUIDS" | jq -r '.[]' | tr '\n' ' ')

        echo "Merging $UUID_COUNT launches for $OS_NAME"

        set +e
        python merge_launches.py \
          --launch-uuids $UUID_LIST \
          --name "$LAUNCH_NAME" \
          --merge-type DEEP \
          --description " " 2>&1 | tee merge_output.log
        EXIT_CODE=${PIPESTATUS[0]}
        set -e

        RP_URL=$(grep -oP 'RP_LAUNCH_URL=\K.*' merge_output.log 2>/dev/null | tail -n 1 || echo "")
        echo "rp_url=$RP_URL" >> $GITHUB_OUTPUT

        rm -f merge_output.log
        exit $EXIT_CODE
