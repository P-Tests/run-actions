name: 'Puppeteer Post'
description: 'Finish the Report Portal launch of one provider/OS and report the chunk outcome to Telegram'

inputs:
  provider:
    description: 'Provider name (e.g. docspaceEU, ncoc, ocis)'
    required: true
  os_name:
    description: 'Operating system name (windows, linux, macos)'
    required: true
  job_name_prefix:
    description: 'Display-name prefix of the chunk jobs for this provider, e.g. "DocSpace EU"'
    required: true
  project_name:
    description: 'Report Portal project name'
    required: true
  api_key:
    description: 'Report Portal API key'
    required: true
  analyze:
    description: 'Run the Report Portal auto-analyzer on the finished launch'
    required: false
    default: 'true'
  branch:
    description: 'Dep.Tests branch to checkout'
    required: false
    default: 'master'
  read_pat:
    description: 'GitHub PAT for private repository access and job status lookup'
    required: true
  telegram_token:
    description: 'Telegram bot token'
    required: true
  telegram_to:
    description: 'Telegram chat ID'
    required: true
  notify:
    description: 'Send the Telegram notification: on a scheduled run only when the result differs from the previous scheduled run'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Finish launch
      id: finish
      uses: ./.github/actions/rp-finish-launch
      with:
        provider: ${{ inputs.provider }}
        os_name: ${{ inputs.os_name }}
        project_name: ${{ inputs.project_name }}
        api_key: ${{ inputs.api_key }}
        branch: ${{ inputs.branch }}
        read_pat: ${{ inputs.read_pat }}
        analyze: ${{ inputs.analyze }}

    - name: Collect chunk jobs info
      id: collect-chunks
      if: always()
      continue-on-error: true
      uses: ./.github/actions/collect-chunk-jobs
      with:
        prefix: ${{ inputs.job_name_prefix }} - ${{ inputs.os_name }}
        read_pat: ${{ inputs.read_pat }}

    - name: Compare with the previous scheduled run
      id: compare
      if: ${{ always() && !cancelled() && inputs.notify == 'true' }}
      # A lookup that fails leaves `send` empty, and the notification goes out: a duplicate beats a lost report.
      continue-on-error: true
      shell: bash
      run: |
        # The result of a run is which of its chunks did not pass; the same set as last time is nothing new.
        signature() {
          jq -c '{ran: (length > 0), problems: ([.[] | select(.conclusion != "success") | "\(.name): \(.conclusion // .status)"] | sort)}'
        }
        CURRENT=$(signature <<< "$CHUNKS_JSON")
        GREEN=$(jq '.ran and (.problems | length == 0)' <<< "$CURRENT")

        # A manual run (a subset, another branch) is no baseline and has none: it reports as before, when not green.
        if [[ "$EVENT_NAME" != "schedule" ]]; then
          [[ "$GREEN" == "true" ]] && SEND=false || SEND=true
          echo "Not a scheduled run - send=$SEND"
          echo "send=$SEND" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        WORKFLOW_ID=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.workflow_id')
        PREVIOUS=""
        PREVIOUS_URL=""
        for PREVIOUS_ID in $(gh api "repos/$GH_REPO/actions/workflows/$WORKFLOW_ID/runs?event=schedule&per_page=10" \
            --jq ".workflow_runs[] | select(.id < $RUN_ID) | .id"); do
          JOBS=$(gh run view "$PREVIOUS_ID" --json jobs \
            | jq -c --arg prefix "$PREFIX" '[.jobs[] | select(.name | startswith($prefix)) | {name, status, conclusion}]')
          if [[ "$(jq 'length > 0 and all(.status == "completed")' <<< "$JOBS")" == "true" ]]; then
            PREVIOUS=$(signature <<< "$JOBS")
            PREVIOUS_URL="${{ github.server_url }}/$GH_REPO/actions/runs/$PREVIOUS_ID"
            break
          fi
        done

        if [[ -z "$PREVIOUS" ]]; then
          [[ "$GREEN" == "true" ]] && SEND=false || SEND=true
          echo "No previous scheduled run of '$PREFIX' - send=$SEND"
        elif [[ "$PREVIOUS" == "$CURRENT" ]]; then
          SEND=false
          echo "Same result as $PREVIOUS_URL - skipping Telegram notification"
        else
          SEND=true
          echo "Result changed since $PREVIOUS_URL"
          echo "previous: $PREVIOUS"
          echo "current:  $CURRENT"
        fi
        echo "send=$SEND" >> "$GITHUB_OUTPUT"
        echo "previous_url=$PREVIOUS_URL" >> "$GITHUB_OUTPUT"
      env:
        CHUNKS_JSON: ${{ steps.collect-chunks.outputs.chunks }}
        PREFIX: ${{ inputs.job_name_prefix }} - ${{ inputs.os_name }}
        EVENT_NAME: ${{ github.event_name }}
        RUN_ID: ${{ github.run_id }}
        GITHUB_TOKEN: ${{ inputs.read_pat }}
        GH_REPO: ${{ github.repository }}

    - name: Send Telegram notification
      if: ${{ always() && !cancelled() && inputs.notify == 'true' && steps.compare.outputs.send != 'false' }}
      shell: bash
      run: |
        FAILED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "failure")] | length')
        CANCELLED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "cancelled")] | length')
        SUCCESS_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')
        TOTAL_COUNT=$(echo "$CHUNKS_JSON" | jq 'length')
        PENDING_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.status != "completed")] | length')

        if [[ "$TOTAL_COUNT" -eq 0 ]]; then
          OVERALL_STATUS="\u274C Tests did not run - an upstream job failed"
        elif [[ "$FAILED_COUNT" -gt 0 ]]; then
          OVERALL_STATUS="\u274C Chunks failed (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
        elif [[ "$CANCELLED_COUNT" -gt 0 ]]; then
          OVERALL_STATUS="\u26D4 Some chunks cancelled (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
        elif [[ "$PENDING_COUNT" -gt 0 ]]; then
          OVERALL_STATUS="\u2753 GitHub did not report ${PENDING_COUNT} chunk(s) as completed (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
        elif [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" ]] && [[ "$TOTAL_COUNT" -gt 0 ]]; then
          OVERALL_STATUS="\u2705 All chunks passed (${TOTAL_COUNT}/${TOTAL_COUNT})"
        else
          OVERALL_STATUS="\u2753 Chunks status unknown"
        fi
        MESSAGE="\n*Workflow:* ${{ github.workflow }}\n*Provider:* $PROVIDER\n*OS:* $OS_NAME\n*Status:* ${OVERALL_STATUS}"
        MESSAGE="${MESSAGE}\n[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        if [[ -n "$RP_URL" ]]; then MESSAGE="${MESSAGE}\n[View Report Portal](${RP_URL})"; fi
        if [[ -n "$PREVIOUS_URL" ]]; then MESSAGE="${MESSAGE}\n[Previous Run](${PREVIOUS_URL})"; fi
        MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g')
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\":\"${TELEGRAM_TO}\",\"text\":\"$MESSAGE\",\"parse_mode\":\"Markdown\",\"disable_notification\":true,\"disable_web_page_preview\":true}"
      env:
        CHUNKS_JSON: ${{ steps.collect-chunks.outputs.chunks }}
        PROVIDER: ${{ inputs.provider }}
        OS_NAME: ${{ inputs.os_name }}
        RP_URL: ${{ steps.finish.outputs.rp_launch_url }}
        PREVIOUS_URL: ${{ steps.compare.outputs.previous_url }}
        TELEGRAM_TOKEN: ${{ inputs.telegram_token }}
        TELEGRAM_TO: ${{ inputs.telegram_to }}
        GITHUB_TOKEN: ${{ inputs.read_pat }}
