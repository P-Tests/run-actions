name: 'Puppeteer Post'
description: 'Resolve the Report Portal launch URL for one provider/OS and report the chunk outcome to Telegram'

inputs:
  provider:
    description: 'Provider name (e.g. docspaceEU, ncoc, ocis)'
    required: true
  os_name:
    description: 'Operating system name (windows, linux, macos)'
    required: true
  job_name_prefix:
    description: 'Display-name prefix of the chunk jobs for this provider, e.g. "DocSpace EU"'
    required: true
  num_chunks:
    description: 'Total chunks in the run; decides whether launches are merged or a single URL is reused'
    required: true
  launch_name:
    description: 'Name for the merged Report Portal launch'
    required: false
    default: 'Github Action All Tests'
  project_name:
    description: 'Report Portal project name'
    required: true
  api_key:
    description: 'Report Portal API key'
    required: true
  branch:
    description: 'Dep.Tests branch to checkout'
    required: false
    default: 'master'
  read_pat:
    description: 'GitHub PAT for private repository access and job status lookup'
    required: true
  telegram_token:
    description: 'Telegram bot token'
    required: true
  telegram_to:
    description: 'Telegram chat ID'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Collect UUIDs
      id: collect
      if: ${{ inputs.num_chunks > 1 }}
      uses: ./.github/actions/collect-uuids
      with:
        os-name: ${{ inputs.os_name }}
        provider: ${{ inputs.provider }}

    - name: Merge Launches
      id: merge
      if: ${{ inputs.num_chunks > 1 }}
      uses: ./.github/actions/merge-launches
      with:
        os-name: ${{ inputs.os_name }}
        launch-uuids: ${{ steps.collect.outputs.launch_uuids }}
        api-key: ${{ inputs.api_key }}
        project-name: ${{ inputs.project_name }}
        github-token: ${{ inputs.read_pat }}
        branch: ${{ inputs.branch }}
        launch-name: ${{ inputs.launch_name }}

    - name: Download URL artifact (single chunk)
      if: ${{ inputs.num_chunks == '1' }}
      continue-on-error: true
      uses: actions/download-artifact@v5
      with:
        pattern: launch-url-${{ inputs.provider }}-${{ inputs.os_name }}-chunk-*
        path: url-artifacts

    - name: Get RP URL
      id: get-rp-url
      shell: bash
      env:
        NUM_CHUNKS: ${{ inputs.num_chunks }}
        PROVIDER: ${{ inputs.provider }}
        OS_NAME: ${{ inputs.os_name }}
        MERGED_RP_URL: ${{ steps.merge.outputs.rp_launch_url }}
      run: |
        if [ "$NUM_CHUNKS" == "1" ]; then
          URL=$(cat url-artifacts/launch-url-"$PROVIDER"-"$OS_NAME"-chunk-*/launch_url.txt 2>/dev/null | head -n 1 | tr -d '[:space:]' || echo "")
          echo "rp_url=$URL" >> $GITHUB_OUTPUT
        else
          echo "rp_url=$MERGED_RP_URL" >> $GITHUB_OUTPUT
        fi

    - name: Collect chunk jobs info
      id: collect-chunks
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        JOBS_JSON=$(gh run view ${{ github.run_id }} --json jobs | jq '.jobs')
        CHUNKS=$(echo "$JOBS_JSON" | jq -r --arg prefix "$JOB_PREFIX - $OS_NAME" '[.[] | select(.name | startswith($prefix))] | map({name: .name, status: .status, conclusion: .conclusion, id: .databaseId, url: .url}) | @json')
        echo "chunks=$CHUNKS" >> $GITHUB_OUTPUT
      env:
        JOB_PREFIX: ${{ inputs.job_name_prefix }}
        OS_NAME: ${{ inputs.os_name }}
        GITHUB_TOKEN: ${{ inputs.read_pat }}

    - name: Send Telegram notification
      if: always()
      shell: bash
      run: |
        FAILED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "failure")] | length')
        CANCELLED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "cancelled")] | length')
        SUCCESS_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')
        TOTAL_COUNT=$(echo "$CHUNKS_JSON" | jq 'length')

        # Report to Telegram only when something is not green; skip on a clean full pass.
        if [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" && "$TOTAL_COUNT" -gt 0 ]]; then
          echo "All chunks passed - skipping Telegram notification"
          exit 0
        fi
        if [[ "$TOTAL_COUNT" -eq 0 ]]; then
          OVERALL_STATUS="\u274C Tests did not run - an upstream job failed"
        elif [[ "$FAILED_COUNT" -gt 0 ]]; then
          OVERALL_STATUS="\u274C Chunks failed (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
        elif [[ "$CANCELLED_COUNT" -gt 0 ]]; then
          OVERALL_STATUS="\u26D4 Some chunks cancelled (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
        elif [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" ]] && [[ "$TOTAL_COUNT" -gt 0 ]]; then
          OVERALL_STATUS="\u2705 All chunks passed (${TOTAL_COUNT}/${TOTAL_COUNT})"
        else
          OVERALL_STATUS="\u2753 Chunks status unknown"
        fi
        MESSAGE="\n*Workflow:* ${{ github.workflow }}\n*Provider:* $PROVIDER\n*OS:* $OS_NAME\n*Status:* ${OVERALL_STATUS}"
        MESSAGE="${MESSAGE}\n[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        if [[ -n "$RP_URL" ]]; then MESSAGE="${MESSAGE}\n[View Report Portal](${RP_URL})"; fi
        MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g')
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\":\"${TELEGRAM_TO}\",\"text\":\"$MESSAGE\",\"parse_mode\":\"Markdown\",\"disable_notification\":true,\"disable_web_page_preview\":true}"
      env:
        CHUNKS_JSON: ${{ steps.collect-chunks.outputs.chunks }}
        PROVIDER: ${{ inputs.provider }}
        OS_NAME: ${{ inputs.os_name }}
        RP_URL: ${{ steps.get-rp-url.outputs.rp_url }}
        TELEGRAM_TOKEN: ${{ inputs.telegram_token }}
        TELEGRAM_TO: ${{ inputs.telegram_to }}
        GITHUB_TOKEN: ${{ inputs.read_pat }}
