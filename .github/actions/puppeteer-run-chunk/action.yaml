name: 'Puppeteer Run Test Chunk'
description: 'Run a specific chunk of Puppeteer tests'

inputs:
  provider:
    description: 'Provider to test (e.g., example)'
    required: true
  chunk_id:
    description: 'Chunk ID to run'
    required: true
  chunk_size:
    description: 'Size of each chunk'
    required: true
  suite:
    description: 'Test suite to run (optional)'
    required: false
    default: ''
  os_name:
    description: 'Operating system name (windows, linux, macos)'
    required: true
  os_config:
    description: 'OS-specific config file name'
    required: true
  project_name:
    description: 'Report Portal project name'
    required: true
  branch:
    description: 'Dep.Tests branch to checkout'
    required: false
    default: 'master'
  read_pat:
    description: 'GitHub PAT for private repository access'
    required: true
  report_key:
    description: 'Report Portal API key'
    required: true
  test_path:
    description: 'Path to specific test file or dir (optional, runs full suite if empty)'
    required: false
    default: ''
  threads:
    description: 'Engine threads for the run (empty - run.py picks automatically)'
    required: false
    default: ''
  clean:
    description: 'Clear test files from the remote server during the run'
    required: false
    default: 'true'
  url:
    description: 'Server URL to test against (optional; overrides testOptions.url in the OS config when set)'
    required: false
    default: ''

outputs:
  rp_url:
    description: 'ReportPortal launch URL'
    value: ${{ steps.run-tests.outputs.rp_url }}

runs:
  using: 'composite'
  steps:
    - name: Checkout Dep.Tests repository
      uses: actions/checkout@v7
      with:
        repository: ONLYOFFICE-data/Dep.Tests
        path: Dep.Tests
        sparse-checkout: |
          puppeteer
          tools
        token: ${{ inputs.read_pat }}
        submodules: false
        ref: ${{ inputs.branch }}
        fetch-depth: 1

    - name: Checkout puppeteer/files (pp-files submodule)
      uses: actions/checkout@v7
      with:
        repository: ONLYOFFICE-data/pp-files
        path: Dep.Tests/puppeteer/files
        token: ${{ inputs.read_pat }}
        fetch-depth: 1

    - name: Cache Python 3.10 toolcache
      uses: actions/cache@v5
      with:
        path: ${{ runner.tool_cache }}/Python/3.10.*
        key: ${{ runner.os }}-${{ runner.arch }}-toolcache-python-3.10

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Cache Report Portal client
      id: cache-rp-modules
      uses: actions/cache@v5
      with:
        path: Dep.Tests/tools/report_portal/pip_modules
        key: ${{ runner.os }}-${{ runner.arch }}-rp-modules-${{ hashFiles('Dep.Tests/tools/report_portal/config.json') }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v5
      with:
        path: Dep.Tests/puppeteer/engine/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node24-modules-${{ hashFiles('Dep.Tests/puppeteer/engine/package-lock.json') }}

    - name: Install npm dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: Dep.Tests/puppeteer/engine
      run: npm ci --prefer-offline --no-audit

    - name: Cache Puppeteer browsers
      id: cache-puppeteer
      uses: actions/cache@v5
      with:
        path: Dep.Tests/puppeteer/engine/browser/puppeteer
        key: ${{ runner.os }}-${{ runner.arch }}-puppeteer-engine-chrome-${{ hashFiles('Dep.Tests/puppeteer/engine/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-puppeteer-engine-chrome-

    - name: Install Chrome for Puppeteer
      if: steps.cache-puppeteer.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd Dep.Tests/puppeteer/engine
        npx puppeteer browsers install chrome

    - name: Configure Report Portal
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project_name }}
        REPORT_API_KEY: ${{ inputs.report_key }}
      run: |
        node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('Dep.Tests/tools/report_portal/config.json', 'utf8'));
          config.api_key = process.env.REPORT_API_KEY;
          config.project_name = process.env.PROJECT_NAME;
          fs.writeFileSync('Dep.Tests/tools/report_portal/config.json', JSON.stringify(config, null, 2));
        "

    - name: Download launch
      uses: actions/download-artifact@v5
      with:
        name: rp-launch-${{ inputs.provider }}-${{ inputs.os_name }}
        path: Dep.Tests/puppeteer/engine

    - name: Configure test server URL
      if: ${{ inputs.url != '' }}
      shell: bash
      working-directory: Dep.Tests/puppeteer
      env:
        OS_CONFIG: ${{ inputs.os_config }}
        SERVER_URL: ${{ inputs.url }}
      run: |
        node -e "
          const fs = require('fs');
          const file = process.env.OS_CONFIG;
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.testOptions = config.testOptions || {};
          config.testOptions.url = process.env.SERVER_URL + 'example';
          fs.writeFileSync(file, JSON.stringify(config, null, 2));
          console.log('Updated testOptions.url in ' + file);
        "

    - name: Configure Chrome sandbox (Linux only)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        CHROME_DIR=$(find Dep.Tests/puppeteer/engine/browser/puppeteer/chrome -name "linux-*" -type d 2>/dev/null | head -n 1 || true)
        if [ -n "$CHROME_DIR" ]; then
          cd "$CHROME_DIR/chrome-linux64/"
          sudo chown root:root chrome_sandbox
          sudo chmod 4755 chrome_sandbox
          sudo cp -p chrome_sandbox /usr/local/sbin/chrome-devel-sandbox
          echo "CHROME_DEVEL_SANDBOX=/usr/local/sbin/chrome-devel-sandbox" >> $GITHUB_ENV
        fi

    - name: Run tests chunk ${{ inputs.chunk_id }}
      id: run-tests
      shell: bash
      working-directory: Dep.Tests/puppeteer/engine
      env:
        PROVIDER: ${{ inputs.provider }}
        CHUNK_ID: ${{ inputs.chunk_id }}
        CHUNK_SIZE: ${{ inputs.chunk_size }}
        BRANCH: ${{ inputs.branch }}
        TEST_PATH: ${{ inputs.test_path }}
        SUITE: ${{ inputs.suite }}
        THREADS: ${{ inputs.threads }}
      run: |
        set +e
        TEST_PATH_ARG=""
        if [ -n "$TEST_PATH" ]; then
          TEST_PATH_ARG="$TEST_PATH"
        fi
        SUITE_ARG=""
        if [ -n "$SUITE" ]; then
          SUITE_ARG="--suite $SUITE"
        fi
        THREADS_ARG=""
        if [ -n "$THREADS" ]; then
          THREADS_ARG="--threads $THREADS"
        fi
        python run.py $TEST_PATH_ARG \
          --providers "$PROVIDER" \
          --chunk-id "$CHUNK_ID" \
          --chunk-size "$CHUNK_SIZE" \
          --branch "$BRANCH" \
          --rerun-failed \
          --disable_animation \
          --config_params puppeteerOptions.headless=true \
          --join-launch rp_launch.json $SUITE_ARG $THREADS_ARG 2>&1 | tee output.log
        EXIT_CODE=${PIPESTATUS[0]}
        set -e

        RP_URL=""
        if [ -f "output.log" ]; then
          RP_URL=$(grep 'RP_LAUNCH_URL=' output.log 2>/dev/null | sed 's/.*RP_LAUNCH_URL=//g' | tr -d '[:space:]' | tail -n 1 || echo "")
        fi
        echo "rp_url=$RP_URL" >> $GITHUB_OUTPUT

        rm -f output.log

        exit $EXIT_CODE

    - name: Clear remote test files
      if: ${{ always() && inputs.clean == 'true' }}
      shell: bash
      working-directory: Dep.Tests/puppeteer/engine
      env:
        PROVIDER: ${{ inputs.provider }}
        CHUNK_ID: ${{ inputs.chunk_id }}
        OS_CONFIG: ${{ inputs.os_config }}
      run: |
        echo "Clearing remote files for $PROVIDER after chunk $CHUNK_ID"
        node script/js/scripts/clearRun.js "$PROVIDER" "../$OS_CONFIG" || true

    - name: Upload test results
      if: ${{ always() && steps.run-tests.outcome == 'failure' }}
      uses: actions/upload-artifact@v5
      with:
        name: results-${{ inputs.provider }}-${{ inputs.os_name }}-chunk-${{ inputs.chunk_id }}
        path: Dep.Tests/puppeteer/out
        retention-days: 2
