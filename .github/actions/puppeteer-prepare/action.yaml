name: 'Puppeteer Prepare Test Matrix'
description: 'Prepare test matrix for chunked Puppeteer tests'

inputs:
  provider:
    description: 'Provider to test (e.g., example)'
    required: true
  chunk_size:
    description: 'Number of tests per chunk'
    required: false
    default: '500'
  branch:
    description: 'Dep.Tests branch to checkout'
    required: false
    default: 'master'
  read_pat:
    description: 'GitHub PAT for private repository access'
    required: true
  test_path:
    description: 'Path to specific test file or dir (optional, counts only matching tests if set)'
    required: false
    default: ''
  suite:
    description: 'Test suite to run (optional)'
    required: false
    default: ''

outputs:
  matrix:
    description: 'Test matrix for chunks'
    value: ${{ steps.set-matrix.outputs.matrix }}
  num_chunks:
    description: 'Number of chunks'
    value: ${{ steps.set-matrix.outputs.num_chunks }}
  chunk_size:
    description: 'Chunk size used'
    value: ${{ steps.set-matrix.outputs.chunk_size }}

runs:
  using: 'composite'
  steps:
    - name: Checkout Dep.Tests repository
      uses: actions/checkout@v7
      with:
        repository: ONLYOFFICE-data/Dep.Tests
        path: Dep.Tests
        sparse-checkout: |
          puppeteer
          tools
        token: ${{ inputs.read_pat }}
        submodules: false
        fetch-depth: 1
        ref: ${{ inputs.branch }}

    - name: Cache Python 3.10 toolcache
      uses: actions/cache@v5
      with:
        path: ${{ runner.tool_cache }}/Python/3.10.*
        key: ${{ runner.os }}-${{ runner.arch }}-toolcache-python-3.10

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v5
      with:
        path: Dep.Tests/puppeteer/engine/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node24-modules-${{ hashFiles('Dep.Tests/puppeteer/engine/package-lock.json') }}

    - name: Install npm dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      working-directory: Dep.Tests/puppeteer/engine
      run: npm ci --prefer-offline --no-audit

    - name: Count tests and generate matrix
      id: set-matrix
      shell: bash
      working-directory: Dep.Tests/puppeteer/engine
      env:
        PROVIDER: ${{ inputs.provider }}
        CHUNK_SIZE: ${{ inputs.chunk_size }}
        TEST_PATH: ${{ inputs.test_path }}
        SUITE: ${{ inputs.suite }}
      run: |
        TEST_PATH_ARG=""
        if [ -n "$TEST_PATH" ]; then
          TEST_PATH_ARG="$TEST_PATH"
        fi
        SUITE_ARG=""
        if [ -n "$SUITE" ]; then
          SUITE_ARG="--suite $SUITE"
        fi

        OUTPUT=$(python run.py $TEST_PATH_ARG \
          --providers "$PROVIDER" \
          --count-tests \
          --chunk-size "$CHUNK_SIZE" $SUITE_ARG)

        NUM_CHUNKS=$(echo "$OUTPUT" | grep "num_chunks=" | cut -d'=' -f2 || true)
        MATRIX=$(echo "$OUTPUT" | grep "matrix=" | cut -d'=' -f2- || true)

        if ! printf '%s' "$NUM_CHUNKS" | grep -Eq '^[1-9][0-9]*$'; then
          echo "::error::run.py --count-tests reported no usable num_chunks (got '$NUM_CHUNKS')"
          echo "--- run.py output ---"
          echo "$OUTPUT"
          exit 1
        fi

        echo "num_chunks=$NUM_CHUNKS" >> $GITHUB_OUTPUT
        echo "chunk_size=$CHUNK_SIZE" >> $GITHUB_OUTPUT
        echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
