name: Puppeteer Daily Tests

on:
  schedule:
    - cron: "53 20 * * *"
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to run on'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      test_path:
        description: 'Specific test file or directory'
        required: false
        default: ''
        type: string
      chunk_size:
        description: 'Tests per parallel chunk'
        required: false
        default: '100'
        type: string
      clean:
        description: 'Clear test files from the remote server after all chunks'
        required: false
        default: true
        type: boolean
      project_name:
        description: 'ReportPortal project name'
        required: false
        default: 'docsserver-daily'
        type: string
      launch_name:
        description: 'ReportPortal launch name'
        required: false
        default: ''
        type: string
      api_key:
        description: 'ReportPortal API key'
        required: false
        default: ''
        type: string

concurrency:
  group: puppeteer-stands
  cancel-in-progress: false

jobs:
  branch-config:
    name: Resolve branches
    runs-on: ubuntu-latest
    outputs:
      docspaceEU: ${{ steps.docspaceEU.outputs.ref }}
      docspaceUS: ${{ steps.docspaceUS.outputs.ref }}
      ncoc: ${{ steps.ncoc.outputs.ref }}
      ocis: ${{ steps.ocis.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Checkout provider configs of Dep.Tests
        uses: actions/checkout@v7
        with:
          repository: ONLYOFFICE-data/Dep.Tests
          path: Dep.Tests
          sparse-checkout: puppeteer/providers
          token: ${{ secrets.READ_PAT }}
          fetch-depth: 1
      - name: Read document servers of the providers
        id: servers
        shell: bash
        run: |
          for p in docspaceEU docspaceUS ncoc ocis; do
            CONFIG=$(jq -r --arg p "$p" '.[$p] // empty' .github/providers.json)
            if [ -z "$CONFIG" ]; then
              echo "::error::Provider '$p' is not listed in .github/providers.json"
              exit 1
            fi
            URL=$(jq -r '.testOptions.apiUrl // empty' "Dep.Tests/$CONFIG")
            if [ -z "$URL" ]; then
              echo "::error::Provider '$p': no testOptions.apiUrl in $CONFIG"
              exit 1
            fi
            echo "$p -> $URL"
            echo "$p=$URL" >> "$GITHUB_OUTPUT"
          done
      - name: Resolve Dep.Tests ref - docspaceEU
        id: docspaceEU
        uses: ./.github/actions/resolve-tests-ref
        with:
          label: provider docspaceEU
          server_url: ${{ steps.servers.outputs.docspaceEU }}
          read_pat: ${{ secrets.READ_PAT }}
      - name: Resolve Dep.Tests ref - docspaceUS
        id: docspaceUS
        uses: ./.github/actions/resolve-tests-ref
        with:
          label: provider docspaceUS
          server_url: ${{ steps.servers.outputs.docspaceUS }}
          read_pat: ${{ secrets.READ_PAT }}
      - name: Resolve Dep.Tests ref - ncoc
        id: ncoc
        uses: ./.github/actions/resolve-tests-ref
        with:
          label: provider ncoc
          server_url: ${{ steps.servers.outputs.ncoc }}
          read_pat: ${{ secrets.READ_PAT }}
      - name: Resolve Dep.Tests ref - ocis
        id: ocis
        uses: ./.github/actions/resolve-tests-ref
        with:
          label: provider ocis
          server_url: ${{ steps.servers.outputs.ocis }}
          read_pat: ${{ secrets.READ_PAT }}

  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          OS_INPUT: ${{ inputs.os }}
        run: |
          OS="$OS_INPUT"
          if [ -z "$OS" ] || [ "$OS" == "all" ]; then
            echo 'matrix={"os":[{"name":"windows","runner":"windows-latest","config":"win"},{"name":"linux","runner":"ubuntu-latest","config":"linux"},{"name":"macos","runner":"macos-latest","config":"mac"}]}' >> $GITHUB_OUTPUT
          elif [ "$OS" == "windows" ]; then
            echo 'matrix={"os":[{"name":"windows","runner":"windows-latest","config":"win"}]}' >> $GITHUB_OUTPUT
          elif [ "$OS" == "linux" ]; then
            echo 'matrix={"os":[{"name":"linux","runner":"ubuntu-latest","config":"linux"}]}' >> $GITHUB_OUTPUT
          elif [ "$OS" == "macos" ]; then
            echo 'matrix={"os":[{"name":"macos","runner":"macos-latest","config":"mac"}]}' >> $GITHUB_OUTPUT
          fi

  install-deps:
    name: Install dependencies - ${{ matrix.os.name }}
    needs: [setup]
    continue-on-error: true
    runs-on: ${{ matrix.os.runner }}
    strategy:
      matrix:
        os: ${{ fromJson(needs.setup.outputs.matrix).os }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies and populate caches
        uses: ./.github/actions/puppeteer-install-deps
        with:
          read_pat: ${{ secrets.READ_PAT }}

  prepare-docspaceEU:
    name: Prepare - DocSpace EU
    needs: [branch-config]
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ needs.branch-config.outputs.docspaceEU }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      num_chunks: ${{ steps.prepare.outputs.num_chunks }}
      chunk_size: ${{ steps.prepare.outputs.chunk_size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Prepare test matrix
        id: prepare
        uses: ./.github/actions/puppeteer-prepare
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          chunk_size: ${{ inputs.chunk_size || '100' }}
          branch: ${{ needs.branch-config.outputs.docspaceEU }}
          read_pat: ${{ secrets.READ_PAT }}
          test_path: ${{ inputs.test_path }}

  start-docspaceEU-windows:
    name: Start launch - DocSpace EU - windows
    needs: [prepare-docspaceEU]
    if: ${{ !cancelled() && needs.prepare-docspaceEU.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Start launch
        uses: ./.github/actions/rp-start-launch
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          os_name: windows
          os_config: config_chrome_win.json
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          launch_name: ${{ inputs.launch_name || 'Daily Tests' }}
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          test_path: ${{ inputs.test_path }}

  run-docspaceEU-windows:
    name: DocSpace EU - windows - Chunk ${{ matrix.chunk }}
    needs: [prepare-docspaceEU, install-deps, start-docspaceEU-windows]
    if: ${{ !cancelled() && needs.start-docspaceEU-windows.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: windows-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare-docspaceEU.outputs.matrix).chunk }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare-docspaceEU.outputs.chunk_size }}
          os_name: windows
          os_config: config_chrome_win.json
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          test_path: ${{ inputs.test_path }}
          clean: false
          threads: 1

  start-docspaceEU-linux:
    name: Start launch - DocSpace EU - linux
    needs: [prepare-docspaceEU, run-docspaceEU-windows]
    if: ${{ !cancelled() && needs.prepare-docspaceEU.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Start launch
        uses: ./.github/actions/rp-start-launch
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          os_name: linux
          os_config: config_chrome_linux.json
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          launch_name: ${{ inputs.launch_name || 'Daily Tests' }}
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          test_path: ${{ inputs.test_path }}

  run-docspaceEU-linux:
    name: DocSpace EU - linux - Chunk ${{ matrix.chunk }}
    needs: [prepare-docspaceEU, start-docspaceEU-linux]
    if: ${{ !cancelled() && needs.start-docspaceEU-linux.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare-docspaceEU.outputs.matrix).chunk }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare-docspaceEU.outputs.chunk_size }}
          os_name: linux
          os_config: config_chrome_linux.json
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          test_path: ${{ inputs.test_path }}
          clean: false
          threads: 1

  start-docspaceEU-macos:
    name: Start launch - DocSpace EU - macos
    needs: [prepare-docspaceEU, run-docspaceEU-linux]
    if: ${{ !cancelled() && needs.prepare-docspaceEU.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Start launch
        uses: ./.github/actions/rp-start-launch
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          os_name: macos
          os_config: config_chrome_mac.json
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          launch_name: ${{ inputs.launch_name || 'Daily Tests' }}
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
