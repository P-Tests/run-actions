name: Puppeteer Daily Tests

on:
  schedule:
    - cron: "53 20 * * *"
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to run on'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      test_path:
        description: 'Specific test file or directory'
        required: false
        default: ''
        type: string
      chunk_size:
        description: 'Tests per parallel chunk'
        required: false
        default: '100'
        type: string
      clean:
        description: 'Clear test files from the remote server after all chunks'
        required: false
        default: true
        type: boolean
      project_name:
        description: 'ReportPortal project name'
        required: false
        default: 'docsserver-daily'
        type: string
      launch_name:
        description: 'ReportPortal launch name'
        required: false
        default: ''
        type: string
      api_key:
        description: 'ReportPortal API key'
        required: false
        default: ''
        type: string

concurrency:
  group: puppeteer-stands
  cancel-in-progress: false

jobs:
  branch-config:
    name: Resolve branches
    runs-on: ubuntu-latest
    outputs:
      docspaceEU: ${{ steps.resolve.outputs.docspaceEU }}
      docspaceUS: ${{ steps.resolve.outputs.docspaceUS }}
      ncoc: ${{ steps.resolve.outputs.ncoc }}
      ocis: ${{ steps.resolve.outputs.ocis }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Resolve Dep.Tests branches
        id: resolve
        shell: bash
        run: |
          for p in docspaceEU docspaceUS ncoc ocis; do
            V=$(jq -r --arg p "$p" '.providers[$p] // "master"' .github/branches.json)
            echo "$p -> $V"
            echo "$p=$V" >> "$GITHUB_OUTPUT"
          done

  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          OS_INPUT: ${{ inputs.os }}
        run: |
          OS="$OS_INPUT"
          if [ -z "$OS" ] || [ "$OS" == "all" ]; then
            echo 'matrix={"os":[{"name":"windows","runner":"windows-latest","config":"win"},{"name":"linux","runner":"ubuntu-latest","config":"linux"},{"name":"macos","runner":"macos-latest","config":"mac"}]}' >> $GITHUB_OUTPUT
          elif [ "$OS" == "windows" ]; then
            echo 'matrix={"os":[{"name":"windows","runner":"windows-latest","config":"win"}]}' >> $GITHUB_OUTPUT
          elif [ "$OS" == "linux" ]; then
            echo 'matrix={"os":[{"name":"linux","runner":"ubuntu-latest","config":"linux"}]}' >> $GITHUB_OUTPUT
          elif [ "$OS" == "macos" ]; then
            echo 'matrix={"os":[{"name":"macos","runner":"macos-latest","config":"mac"}]}' >> $GITHUB_OUTPUT
          fi

  install-deps:
    name: Install dependencies - ${{ matrix.os.name }}
    needs: [setup]
    continue-on-error: true
    runs-on: ${{ matrix.os.runner }}
    strategy:
      matrix:
        os: ${{ fromJson(needs.setup.outputs.matrix).os }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies and populate caches
        uses: ./.github/actions/puppeteer-install-deps
        with:
          read_pat: ${{ secrets.READ_PAT }}

  prepare-docspaceEU:
    name: Prepare - DocSpace EU
    needs: [branch-config]
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ needs.branch-config.outputs.docspaceEU }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      num_chunks: ${{ steps.prepare.outputs.num_chunks }}
      chunk_size: ${{ steps.prepare.outputs.chunk_size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Prepare test matrix
        id: prepare
        uses: ./.github/actions/puppeteer-prepare
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          chunk_size: ${{ inputs.chunk_size || '100' }}
          branch: ${{ needs.branch-config.outputs.docspaceEU }}
          read_pat: ${{ secrets.READ_PAT }}
          test_path: ${{ inputs.test_path }}

  run-docspaceEU-windows:
    name: DocSpace EU - windows - Chunk ${{ matrix.chunk }}
    needs: [prepare-docspaceEU, install-deps]
    if: ${{ !cancelled() && needs.prepare-docspaceEU.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: windows-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare-docspaceEU.outputs.matrix).chunk }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare-docspaceEU.outputs.chunk_size }}
          num_chunks: ${{ needs.prepare-docspaceEU.outputs.num_chunks }}
          os_name: windows
          os_config: config_chrome_win.json
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          launch_name: "${{ inputs.launch_name || format('Daily Tests{0}', needs.prepare-docspaceEU.outputs.num_chunks > 1 && format(' - Chunk {0}', matrix.chunk) || '') }}"
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          test_path: ${{ inputs.test_path }}
          clean: false
          threads: 1

  run-docspaceEU-linux:
    name: DocSpace EU - linux - Chunk ${{ matrix.chunk }}
    needs: [prepare-docspaceEU, run-docspaceEU-windows]
    if: ${{ !cancelled() && needs.prepare-docspaceEU.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare-docspaceEU.outputs.matrix).chunk }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare-docspaceEU.outputs.chunk_size }}
          num_chunks: ${{ needs.prepare-docspaceEU.outputs.num_chunks }}
          os_name: linux
          os_config: config_chrome_linux.json
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          launch_name: "${{ inputs.launch_name || format('Daily Tests{0}', needs.prepare-docspaceEU.outputs.num_chunks > 1 && format(' - Chunk {0}', matrix.chunk) || '') }}"
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          test_path: ${{ inputs.test_path }}
          clean: false
          threads: 1

  run-docspaceEU-macos:
    name: DocSpace EU - macos - Chunk ${{ matrix.chunk }}
    needs: [prepare-docspaceEU, run-docspaceEU-linux]
    if: ${{ !cancelled() && needs.prepare-docspaceEU.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos') }}
    runs-on: macos-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare-docspaceEU.outputs.matrix).chunk }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'daily' || '' }}
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare-docspaceEU.outputs.chunk_size }}
          num_chunks: ${{ needs.prepare-docspaceEU.outputs.num_chunks }}
          os_name: macos
          os_config: config_chrome_mac.json
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          launch_name: "${{ inputs.launch_name || format('Daily Tests{0}', needs.prepare-docspaceEU.outputs.num_chunks > 1 && format(' - Chunk {0}', matrix.chunk) || '') }}"
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          test_path: ${{ inputs.test_path }}
          clean: false
          threads: 1

  post-docspaceEU-windows:
    name: Post - DocSpace EU - windows
    needs: [prepare-docspaceEU, run-docspaceEU-windows]
    if: ${{ !cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Report DocSpace EU - windows
        uses: ./.github/actions/puppeteer-post
        with:
          provider: docspaceEU
          os_name: windows
          job_name_prefix: 'DocSpace EU'
          num_chunks: ${{ needs.prepare-docspaceEU.outputs.num_chunks }}
          launch_name: Daily Tests
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}

  post-docspaceEU-linux:
    name: Post - DocSpace EU - linux
    needs: [prepare-docspaceEU, run-docspaceEU-linux]
    if: ${{ !cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux') }}
    runs-on: ubuntu-latest
    steps:
