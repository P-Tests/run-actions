          os_name: macos
          os_config: config_chrome_mac.json
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          test_path: ${{ inputs.test_path }}
          clean: false
          threads: 1

  post-docspaceEU-windows:
    name: Post - DocSpace EU - windows
    needs: [prepare-docspaceEU, run-docspaceEU-windows, start-docspaceEU-windows]
    if: ${{ always() && needs.start-docspaceEU-windows.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Report DocSpace EU - windows
        uses: ./.github/actions/puppeteer-post
        with:
          provider: docspaceEU
          os_name: windows
          job_name_prefix: 'DocSpace EU'
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}

  post-docspaceEU-linux:
    name: Post - DocSpace EU - linux
    needs: [prepare-docspaceEU, run-docspaceEU-linux, start-docspaceEU-linux]
    if: ${{ always() && needs.start-docspaceEU-linux.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux') }}
