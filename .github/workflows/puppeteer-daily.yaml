    if: ${{ always() && needs.start-docspaceUS-linux.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Report DocSpace US - linux
        uses: ./.github/actions/puppeteer-post
        with:
          provider: docspaceUS
          os_name: linux
          job_name_prefix: 'DocSpace US'
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceUS.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}

  post-docspaceUS-macos:
    name: Post - DocSpace US - macos
    needs: [prepare-docspaceUS, run-docspaceUS-macos, start-docspaceUS-macos]
    if: ${{ always() && needs.start-docspaceUS-macos.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos') }}
    runs-on: ubuntu-latest
    steps:
