          num_chunks: ${{ needs.prepare-docspaceEU.outputs.num_chunks }}
          launch_name: Daily Tests
          project_name: ${{ inputs.project_name || 'docsserver-daily' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
