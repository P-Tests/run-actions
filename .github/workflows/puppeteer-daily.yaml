  post-ncoc-windows:
    name: Post - NCOC - windows
    needs: [prepare-ncoc, run-ncoc-windows]
    if: ${{ !cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows') }}
