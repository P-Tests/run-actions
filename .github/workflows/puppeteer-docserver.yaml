name: Puppeteer DocServer test
run-name: Puppeteer DocServer test - ${{ github.event.inputs.url }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Stand to test'
        required: true
        default: kim
        type: choice
        options:
          - kim
          - doc-linux
      os:
        description: 'Operating system to run on'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      branch:
        description: 'Dep.Tests branch override — leave empty to use the stand default'
        required: false
        default: ''
        type: string
      test_path:
        description: 'Specific test file or directory'
        required: false
        default: ''
        type: string
      chunk_size:
        description: 'Tests per parallel chunk'
        required: false
        default: '100'
        type: string
      clean:
        description: 'Clear test files from the remote server after each chunk'
        required: false
        default: true
        type: boolean
      project_name:
        description: 'ReportPortal project name'
        required: false
        default: 'docsserver'
        type: string
      launch_name:
        description: 'ReportPortal launch name'
        required: false
        default: ''
        type: string
      api_key:
        description: 'ReportPortal API key'
        required: false
        default: ''
        type: string

jobs:
  branch-config:
    name: Resolve branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Resolve Dep.Tests branch
        id: resolve
        shell: bash
        env:
          BRANCH_INPUT: ${{ inputs.branch }}
          STAND: ${{ inputs.url }}
        run: |
          if [ -n "$BRANCH_INPUT" ]; then
            BRANCH="$BRANCH_INPUT"
            echo "Branch override -> Dep.Tests branch '$BRANCH'"
          else
            BRANCH=$(jq -r --arg s "$STAND" '.docserver[$s] // "master"' .github/branches.json)
            echo "Stand '$STAND' -> Dep.Tests branch '$BRANCH'"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare Test Matrix
    needs: [branch-config]
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ needs.branch-config.outputs.branch }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      num_chunks: ${{ steps.prepare.outputs.num_chunks }}
      chunk_size: ${{ steps.prepare.outputs.chunk_size }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare test matrix
        id: prepare
        uses: ./.github/actions/puppeteer-prepare
        with:
          provider: example
          chunk_size: ${{ github.event.inputs.chunk_size }}
          branch: ${{ needs.branch-config.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          test_path: ${{ inputs.test_path }}

  install-deps-windows:
    name: Install dependencies - windows
    if: "inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows'"
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies and populate caches
        uses: ./.github/actions/puppeteer-install-deps
        with:
          read_pat: ${{ secrets.READ_PAT }}

  install-deps-linux:
    name: Install dependencies - linux
    if: "inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux'"
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies and populate caches
        uses: ./.github/actions/puppeteer-install-deps
        with:
          read_pat: ${{ secrets.READ_PAT }}

  install-deps-macos:
    name: Install dependencies - macos
    if: "inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos'"
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies and populate caches
        uses: ./.github/actions/puppeteer-install-deps
        with:
          read_pat: ${{ secrets.READ_PAT }}

  run-tests-windows:
    name: Windows - Chunk ${{ matrix.chunk }}
    needs: [prepare, install-deps-windows]
    if: "!cancelled() && needs.prepare.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows')"
    runs-on: windows-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.matrix).chunk }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: example
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare.outputs.chunk_size }}
          num_chunks: ${{ needs.prepare.outputs.num_chunks }}
          os_name: windows
          os_config: config_chrome_win.json
          project_name: ${{ inputs.project_name || 'docsserver' }}
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          clean: ${{ inputs.clean }}
          url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}
          launch_name: "${{ inputs.launch_name || format('{0}{1}', inputs.test_path == '' && 'Github Action All Tests' || 'Github Action Target Tests', needs.prepare.outputs.num_chunks > 1 && format(' - Chunk {0}', matrix.chunk) || '') }}"

  collect-uuids-windows:
    name: Collect Windows UUIDs
    needs: [prepare, run-tests-windows]
    runs-on: ubuntu-latest
    if: "!cancelled() && needs.prepare.outputs.num_chunks > 1 && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows')"
    outputs:
      launch_uuids: ${{ steps.collect.outputs.launch_uuids }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Collect UUIDs
        id: collect
        uses: ./.github/actions/collect-uuids
        with:
          os-name: windows
          provider: example

  merge-launches-windows:
    name: Merge Windows Launches
    needs: [prepare, collect-uuids-windows]
    runs-on: ubuntu-latest
    if: "!cancelled() && needs.prepare.outputs.num_chunks > 1 && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows')"
    outputs:
      rp_launch_url: ${{ steps.merge.outputs.rp_launch_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge Launches
        id: merge
        uses: ./.github/actions/merge-launches
        with:
          os-name: windows
          launch-uuids: ${{ needs.collect-uuids-windows.outputs.launch_uuids }}
          api-key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          project-name: ${{ inputs.project_name || 'docsserver' }}
          github-token: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare.outputs.branch }}
          launch-name: ${{ inputs.test_path == '' && 'Github Action All Tests' || 'Github Action Target Tests' }}

  run-tests-linux:
    name: Linux - Chunk ${{ matrix.chunk }}
    needs: [prepare, install-deps-linux]
    if: "!cancelled() && needs.prepare.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux')"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.matrix).chunk }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: example
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare.outputs.chunk_size }}
          num_chunks: ${{ needs.prepare.outputs.num_chunks }}
          os_name: linux
          os_config: config_chrome_linux.json
          project_name: ${{ inputs.project_name || 'docsserver' }}
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          clean: ${{ inputs.clean }}
          url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}
          launch_name: "${{ inputs.launch_name || format('{0}{1}', inputs.test_path == '' && 'Github Action All Tests' || 'Github Action Target Tests', needs.prepare.outputs.num_chunks > 1 && format(' - Chunk {0}', matrix.chunk) || '') }}"

  collect-uuids-linux:
    name: Collect Linux UUIDs
    needs: [prepare, run-tests-linux]
    runs-on: ubuntu-latest
    if: "!cancelled() && needs.prepare.outputs.num_chunks > 1 && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux')"
    outputs:
      launch_uuids: ${{ steps.collect.outputs.launch_uuids }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Collect UUIDs
        id: collect
        uses: ./.github/actions/collect-uuids
        with:
          os-name: linux
          provider: example

  merge-launches-linux:
    name: Merge Linux Launches
    needs: [prepare, collect-uuids-linux]
    runs-on: ubuntu-latest
    if: "!cancelled() && needs.prepare.outputs.num_chunks > 1 && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux')"
    outputs:
      rp_launch_url: ${{ steps.merge.outputs.rp_launch_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge Launches
        id: merge
        uses: ./.github/actions/merge-launches
        with:
          os-name: linux
          launch-uuids: ${{ needs.collect-uuids-linux.outputs.launch_uuids }}
          api-key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          project-name: ${{ inputs.project_name || 'docsserver' }}
          github-token: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare.outputs.branch }}
          launch-name: ${{ inputs.test_path == '' && 'Github Action All Tests' || 'Github Action Target Tests' }}

  run-tests-macos:
    name: macOS - Chunk ${{ matrix.chunk }}
    needs: [prepare, install-deps-macos]
    if: "!cancelled() && needs.prepare.result == 'success' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos')"
    runs-on: macos-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.matrix).chunk }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: example
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare.outputs.chunk_size }}
          num_chunks: ${{ needs.prepare.outputs.num_chunks }}
          os_name: macos
          os_config: config_chrome_mac.json
          project_name: ${{ inputs.project_name || 'docsserver' }}
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          clean: ${{ inputs.clean }}
          url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}
          launch_name: "${{ inputs.launch_name || format('{0}{1}', inputs.test_path == '' && 'Github Action All Tests' || 'Github Action Target Tests', needs.prepare.outputs.num_chunks > 1 && format(' - Chunk {0}', matrix.chunk) || '') }}"

  collect-uuids-macos:
    name: Collect macOS UUIDs
    needs: [prepare, run-tests-macos]
    runs-on: ubuntu-latest
    if: "!cancelled() && needs.prepare.outputs.num_chunks > 1 && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos')"
    outputs:
      launch_uuids: ${{ steps.collect.outputs.launch_uuids }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Collect UUIDs
        id: collect
        uses: ./.github/actions/collect-uuids
        with:
          os-name: macos
          provider: example

  merge-launches-macos:
    name: Merge macOS Launches
    needs: [prepare, collect-uuids-macos]
    runs-on: ubuntu-latest
    if: "!cancelled() && needs.prepare.outputs.num_chunks > 1 && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos')"
    outputs:
      rp_launch_url: ${{ steps.merge.outputs.rp_launch_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge Launches
        id: merge
        uses: ./.github/actions/merge-launches
        with:
          os-name: macos
          launch-uuids: ${{ needs.collect-uuids-macos.outputs.launch_uuids }}
          api-key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          project-name: ${{ inputs.project_name || 'docsserver' }}
          github-token: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare.outputs.branch }}
          launch-name: ${{ inputs.test_path == '' && 'Github Action All Tests' || 'Github Action Target Tests' }}

  final-summary-windows:
    name: Windows Test Summary
    needs: [prepare, merge-launches-windows]
    runs-on: ubuntu-latest
    if: "!cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download URL artifact (single chunk)
        if: needs.prepare.outputs.num_chunks == '1'
        uses: actions/download-artifact@v5
        with:
          pattern: launch-url-example-windows-chunk-*
          path: url-artifacts

      - name: Get RP URL
        id: get-rp-url
        shell: bash
        run: |
          if [ "${{ needs.prepare.outputs.num_chunks }}" == "1" ]; then
            URL=$(cat url-artifacts/launch-url-example-windows-chunk-*/launch_url.txt 2>/dev/null | head -n 1 | tr -d '[:space:]' || echo "")
            echo "rp_url=$URL" >> $GITHUB_OUTPUT
          else
            echo "rp_url=${{ needs.merge-launches-windows.outputs.rp_launch_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Collect Windows chunk jobs info
        id: collect-chunks
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          JOBS_JSON=$(gh run view ${{ github.run_id }} --json jobs | jq '.jobs')

          CHUNKS=$(echo "$JOBS_JSON" | jq -r '[.[] | select(.name | startswith("Windows - Chunk"))] | map({name: .name, status: .status, conclusion: .conclusion, id: .databaseId, url: .url}) | @json')
          echo "chunks=$CHUNKS" >> $GITHUB_OUTPUT

          MERGE_URL=$(echo "$JOBS_JSON" | jq -r '.[] | select(.name == "Merge Windows Launches") | .url')
          echo "merge_url=$MERGE_URL" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PAT }}

      - name: Send comprehensive Telegram notification
        if: always()
        shell: bash
        env:
          CHUNKS_JSON: ${{ steps.collect-chunks.outputs.chunks }}
          MERGE_URL: ${{ steps.collect-chunks.outputs.merge_url }}
          RP_URL: ${{ steps.get-rp-url.outputs.rp_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          FAILED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "failure")] | length')
          CANCELLED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "cancelled")] | length')
          SUCCESS_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')
          TOTAL_COUNT=$(echo "$CHUNKS_JSON" | jq 'length')

          # Report to Telegram only when something is not green; skip on a clean full pass.
          if [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" && "$TOTAL_COUNT" -gt 0 ]]; then
            echo "All chunks passed - skipping Telegram notification"
            exit 0
          fi

          if [[ "$TOTAL_COUNT" -eq 0 ]]; then
            OVERALL_STATUS="❌ Tests did not run - an upstream job failed"
          elif [[ "$FAILED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="❌ Chunks failed (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$CANCELLED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="🚫 Some chunks cancelled (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" ]] && [[ "$TOTAL_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="✅ All chunks passed (${TOTAL_COUNT}/${TOTAL_COUNT})"
          else
            OVERALL_STATUS="❓ Chunks status unknown"
          fi

          MESSAGE="${MESSAGE}\n*Workflow:* ${{ github.workflow }}"
          MESSAGE="${MESSAGE}\n*Provider:* example"
          MESSAGE="${MESSAGE}\n*Platform:* windows"
          MESSAGE="${MESSAGE}\n*Browser:* chrome"
          MESSAGE="${MESSAGE}\n*Branch:* ${{ needs.prepare.outputs.branch }}"
          MESSAGE="${MESSAGE}\n*Stand:* ${{ github.event.inputs.url }}"
          MESSAGE="${MESSAGE}\n*Status:* ${OVERALL_STATUS}"
          MESSAGE="${MESSAGE}\n"

          if [[ "${{ needs.prepare.outputs.num_chunks }}" -gt 1 ]]; then
            MESSAGE="${MESSAGE}\n[View Merge Job](${MERGE_URL})"
          fi

          MESSAGE="${MESSAGE}\n[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          if [[ -n "$RP_URL" ]]; then
            MESSAGE="${MESSAGE}\n[View Report Portal](${RP_URL})"
          fi

          MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TELEGRAM_TO}\",
              \"text\": \"$MESSAGE\",
              \"parse_mode\": \"Markdown\",
              \"disable_notification\": true,
              \"disable_web_page_preview\": true
            }"

  final-summary-linux:
    name: Linux Test Summary
    needs: [prepare, merge-launches-linux]
    runs-on: ubuntu-latest
    if: "!cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download URL artifact (single chunk)
        if: needs.prepare.outputs.num_chunks == '1'
        uses: actions/download-artifact@v5
        with:
          pattern: launch-url-example-linux-chunk-*
          path: url-artifacts

      - name: Get RP URL
        id: get-rp-url
        shell: bash
        run: |
          if [ "${{ needs.prepare.outputs.num_chunks }}" == "1" ]; then
            URL=$(cat url-artifacts/launch-url-example-linux-chunk-*/launch_url.txt 2>/dev/null | head -n 1 | tr -d '[:space:]' || echo "")
            echo "rp_url=$URL" >> $GITHUB_OUTPUT
          else
            echo "rp_url=${{ needs.merge-launches-linux.outputs.rp_launch_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Collect Linux chunk jobs info
        id: collect-chunks
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          JOBS_JSON=$(gh run view ${{ github.run_id }} --json jobs | jq '.jobs')

          CHUNKS=$(echo "$JOBS_JSON" | jq -r '[.[] | select(.name | startswith("Linux - Chunk"))] | map({name: .name, status: .status, conclusion: .conclusion, id: .databaseId, url: .url}) | @json')
          echo "chunks=$CHUNKS" >> $GITHUB_OUTPUT

          MERGE_URL=$(echo "$JOBS_JSON" | jq -r '.[] | select(.name == "Merge Linux Launches") | .url')
          echo "merge_url=$MERGE_URL" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PAT }}

      - name: Send comprehensive Telegram notification
        if: always()
        shell: bash
        env:
          CHUNKS_JSON: ${{ steps.collect-chunks.outputs.chunks }}
          MERGE_URL: ${{ steps.collect-chunks.outputs.merge_url }}
          RP_URL: ${{ steps.get-rp-url.outputs.rp_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          FAILED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "failure")] | length')
          CANCELLED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "cancelled")] | length')
          SUCCESS_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')
          TOTAL_COUNT=$(echo "$CHUNKS_JSON" | jq 'length')

          # Report to Telegram only when something is not green; skip on a clean full pass.
          if [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" && "$TOTAL_COUNT" -gt 0 ]]; then
            echo "All chunks passed - skipping Telegram notification"
            exit 0
          fi

          if [[ "$TOTAL_COUNT" -eq 0 ]]; then
            OVERALL_STATUS="❌ Tests did not run - an upstream job failed"
          elif [[ "$FAILED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="❌ Chunks failed (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$CANCELLED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="🚫 Some chunks cancelled (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" ]] && [[ "$TOTAL_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="✅ All chunks passed (${TOTAL_COUNT}/${TOTAL_COUNT})"
          else
            OVERALL_STATUS="❓ Chunks status unknown"
          fi

          MESSAGE="${MESSAGE}\n*Workflow:* ${{ github.workflow }}"
          MESSAGE="${MESSAGE}\n*Provider:* example"
          MESSAGE="${MESSAGE}\n*Platform:* linux"
          MESSAGE="${MESSAGE}\n*Browser:* chrome"
          MESSAGE="${MESSAGE}\n*Branch:* ${{ needs.prepare.outputs.branch }}"
          MESSAGE="${MESSAGE}\n*Stand:* ${{ github.event.inputs.url }}"
          MESSAGE="${MESSAGE}\n*Status:* ${OVERALL_STATUS}"
          MESSAGE="${MESSAGE}\n"

          if [[ "${{ needs.prepare.outputs.num_chunks }}" -gt 1 ]]; then
            MESSAGE="${MESSAGE}\n[View Merge Job](${MERGE_URL})"
          fi

          MESSAGE="${MESSAGE}\n[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          if [[ -n "$RP_URL" ]]; then
            MESSAGE="${MESSAGE}\n[View Report Portal](${RP_URL})"
          fi

          MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TELEGRAM_TO}\",
              \"text\": \"$MESSAGE\",
              \"parse_mode\": \"Markdown\",
              \"disable_notification\": true,
              \"disable_web_page_preview\": true
            }"

  final-summary-macos:
    name: macOS Test Summary
    needs: [prepare, merge-launches-macos]
    runs-on: ubuntu-latest
    if: "!cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download URL artifact (single chunk)
        if: needs.prepare.outputs.num_chunks == '1'
        uses: actions/download-artifact@v5
        with:
          pattern: launch-url-example-macos-chunk-*
          path: url-artifacts

      - name: Get RP URL
        id: get-rp-url
        shell: bash
        run: |
          if [ "${{ needs.prepare.outputs.num_chunks }}" == "1" ]; then
            URL=$(cat url-artifacts/launch-url-example-macos-chunk-*/launch_url.txt 2>/dev/null | head -n 1 | tr -d '[:space:]' || echo "")
            echo "rp_url=$URL" >> $GITHUB_OUTPUT
          else
            echo "rp_url=${{ needs.merge-launches-macos.outputs.rp_launch_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Collect macOS chunk jobs info
        id: collect-chunks
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          JOBS_JSON=$(gh run view ${{ github.run_id }} --json jobs | jq '.jobs')

          CHUNKS=$(echo "$JOBS_JSON" | jq -r '[.[] | select(.name | startswith("macOS - Chunk"))] | map({name: .name, status: .status, conclusion: .conclusion, id: .databaseId, url: .url}) | @json')
          echo "chunks=$CHUNKS" >> $GITHUB_OUTPUT

          MERGE_URL=$(echo "$JOBS_JSON" | jq -r '.[] | select(.name == "Merge macOS Launches") | .url')
          echo "merge_url=$MERGE_URL" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PAT }}

      - name: Send comprehensive Telegram notification
        if: always()
        shell: bash
        env:
          CHUNKS_JSON: ${{ steps.collect-chunks.outputs.chunks }}
          MERGE_URL: ${{ steps.collect-chunks.outputs.merge_url }}
          RP_URL: ${{ steps.get-rp-url.outputs.rp_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          FAILED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "failure")] | length')
          CANCELLED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "cancelled")] | length')
          SUCCESS_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')
          TOTAL_COUNT=$(echo "$CHUNKS_JSON" | jq 'length')

          # Report to Telegram only when something is not green; skip on a clean full pass.
          if [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" && "$TOTAL_COUNT" -gt 0 ]]; then
            echo "All chunks passed - skipping Telegram notification"
            exit 0
          fi

          if [[ "$TOTAL_COUNT" -eq 0 ]]; then
            OVERALL_STATUS="❌ Tests did not run - an upstream job failed"
          elif [[ "$FAILED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="❌ Chunks failed (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$CANCELLED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="🚫 Some chunks cancelled (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" ]] && [[ "$TOTAL_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="✅ All chunks passed (${TOTAL_COUNT}/${TOTAL_COUNT})"
          else
            OVERALL_STATUS="❓ Chunks status unknown"
          fi

          MESSAGE="${MESSAGE}\n*Workflow:* ${{ github.workflow }}"
          MESSAGE="${MESSAGE}\n*Provider:* example"
          MESSAGE="${MESSAGE}\n*Platform:* macos"
          MESSAGE="${MESSAGE}\n*Browser:* chrome"
          MESSAGE="${MESSAGE}\n*Branch:* ${{ needs.prepare.outputs.branch }}"
          MESSAGE="${MESSAGE}\n*Stand:* ${{ github.event.inputs.url }}"
          MESSAGE="${MESSAGE}\n*Status:* ${OVERALL_STATUS}"
          MESSAGE="${MESSAGE}\n"

          if [[ "${{ needs.prepare.outputs.num_chunks }}" -gt 1 ]]; then
            MESSAGE="${MESSAGE}\n[View Merge Job](${MERGE_URL})"
          fi

          MESSAGE="${MESSAGE}\n[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          if [[ -n "$RP_URL" ]]; then
            MESSAGE="${MESSAGE}\n[View Report Portal](${RP_URL})"
          fi

          MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TELEGRAM_TO}\",
              \"text\": \"$MESSAGE\",
              \"parse_mode\": \"Markdown\",
              \"disable_notification\": true,
              \"disable_web_page_preview\": true
            }"
