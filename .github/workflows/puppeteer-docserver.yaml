name: Puppeteer DocServer test
run-name: Puppeteer DocServer test - ${{ inputs.url }} - ${{ inputs.os }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Stand to test'
        required: true
        default: kim
        type: choice
        options:
          - kim
          - doc-linux
      os:
        description: 'Operating system to run on'
        required: true
        default: 'linux'
        type: choice
        options:
          - windows
          - linux
          - macos
      branch:
        description: 'Dep.Tests branch or tag override — leave empty to use the tag of the stand build'
        required: false
        default: ''
        type: string
      test_path:
        description: 'Specific test file or directory'
        required: false
        default: ''
        type: string
      chunk_size:
        description: 'Tests per parallel chunk'
        required: false
        default: '100'
        type: string
      clean:
        description: 'Clear test files from the remote server after each chunk'
        required: false
        default: true
        type: boolean
      project_name:
        description: 'ReportPortal project name'
        required: false
        default: 'docsserver'
        type: string
      launch_name:
        description: 'ReportPortal launch name'
        required: false
        default: ''
        type: string
      api_key:
        description: 'ReportPortal API key'
        required: false
        default: ''
        type: string
      analyze:
        description: 'Run the ReportPortal auto-analyzer when the launch is complete'
        required: false
        default: true
        type: boolean
      notify:
        description: 'Send the Telegram notification'
        required: false
        default: true
        type: boolean

concurrency:
  group: puppeteer-docserver
  cancel-in-progress: false

jobs:
  branch-config:
    name: Resolve branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Resolve Dep.Tests ref from the branch or the stand build
        id: resolve
        uses: ./.github/actions/resolve-tests-ref
        with:
          label: stand ${{ inputs.url }}
          server_url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}
          branch: ${{ inputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}

  prepare:
    name: Prepare Test Matrix
    needs: [branch-config]
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ needs.branch-config.outputs.branch }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      num_chunks: ${{ steps.prepare.outputs.num_chunks }}
      chunk_size: ${{ steps.prepare.outputs.chunk_size }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare test matrix
        id: prepare
        uses: ./.github/actions/puppeteer-prepare
        with:
          provider: example
          chunk_size: ${{ github.event.inputs.chunk_size }}
          branch: ${{ needs.branch-config.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          test_path: ${{ inputs.test_path }}

  install-deps-windows:
    name: Install dependencies - windows
    if: "inputs.os == 'windows'"
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies and populate caches
        uses: ./.github/actions/puppeteer-install-deps
        with:
          read_pat: ${{ secrets.READ_PAT }}

  install-deps-linux:
    name: Install dependencies - linux
    if: "inputs.os == 'linux'"
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies and populate caches
        uses: ./.github/actions/puppeteer-install-deps
        with:
          read_pat: ${{ secrets.READ_PAT }}

  install-deps-macos:
    name: Install dependencies - macos
    if: "inputs.os == 'macos'"
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies and populate caches
        uses: ./.github/actions/puppeteer-install-deps
        with:
          read_pat: ${{ secrets.READ_PAT }}

  start-launch-windows:
    name: Start Windows Launch
    needs: [prepare]
    if: "!cancelled() && needs.prepare.result == 'success' && inputs.os == 'windows'"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start launch
        uses: ./.github/actions/rp-start-launch
        with:
          provider: example
          os_name: windows
          os_config: config_chrome_win.json
          project_name: ${{ inputs.project_name || 'docsserver' }}
          launch_name: ${{ inputs.launch_name || (inputs.test_path == '' && 'Github Action All Tests' || 'Github Action Target Tests') }}
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}

  run-tests-windows:
    name: Windows - Chunk ${{ matrix.chunk }}
    needs: [prepare, install-deps-windows, start-launch-windows]
    if: "!cancelled() && needs.start-launch-windows.result == 'success' && inputs.os == 'windows'"
    runs-on: windows-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.matrix).chunk }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: example
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare.outputs.chunk_size }}
          os_name: windows
          os_config: config_chrome_win.json
          project_name: ${{ inputs.project_name || 'docsserver' }}
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          clean: ${{ inputs.clean }}
          url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}

  finish-launch-windows:
    name: Finish Windows Launch
    needs: [prepare, start-launch-windows, run-tests-windows]
    runs-on: ubuntu-latest
    if: "always() && needs.start-launch-windows.result == 'success'"
    outputs:
      rp_launch_url: ${{ steps.finish.outputs.rp_launch_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Finish launch
        id: finish
        uses: ./.github/actions/rp-finish-launch
        with:
          provider: example
          os_name: windows
          project_name: ${{ inputs.project_name || 'docsserver' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare.outputs.branch }}
          analyze: ${{ inputs.analyze }}

  start-launch-linux:
    name: Start Linux Launch
    needs: [prepare]
    if: "!cancelled() && needs.prepare.result == 'success' && inputs.os == 'linux'"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start launch
        uses: ./.github/actions/rp-start-launch
        with:
          provider: example
          os_name: linux
          os_config: config_chrome_linux.json
          project_name: ${{ inputs.project_name || 'docsserver' }}
          launch_name: ${{ inputs.launch_name || (inputs.test_path == '' && 'Github Action All Tests' || 'Github Action Target Tests') }}
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}

  run-tests-linux:
    name: Linux - Chunk ${{ matrix.chunk }}
    needs: [prepare, install-deps-linux, start-launch-linux]
    if: "!cancelled() && needs.start-launch-linux.result == 'success' && inputs.os == 'linux'"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.matrix).chunk }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: example
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare.outputs.chunk_size }}
          os_name: linux
          os_config: config_chrome_linux.json
          project_name: ${{ inputs.project_name || 'docsserver' }}
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          clean: ${{ inputs.clean }}
          url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}

  finish-launch-linux:
    name: Finish Linux Launch
    needs: [prepare, start-launch-linux, run-tests-linux]
    runs-on: ubuntu-latest
    if: "always() && needs.start-launch-linux.result == 'success'"
    outputs:
      rp_launch_url: ${{ steps.finish.outputs.rp_launch_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Finish launch
        id: finish
        uses: ./.github/actions/rp-finish-launch
        with:
          provider: example
          os_name: linux
          project_name: ${{ inputs.project_name || 'docsserver' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare.outputs.branch }}
          analyze: ${{ inputs.analyze }}

  start-launch-macos:
    name: Start macOS Launch
    needs: [prepare]
    if: "!cancelled() && needs.prepare.result == 'success' && inputs.os == 'macos'"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start launch
        uses: ./.github/actions/rp-start-launch
        with:
          provider: example
          os_name: macos
          os_config: config_chrome_mac.json
          project_name: ${{ inputs.project_name || 'docsserver' }}
          launch_name: ${{ inputs.launch_name || (inputs.test_path == '' && 'Github Action All Tests' || 'Github Action Target Tests') }}
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}

  run-tests-macos:
    name: macOS - Chunk ${{ matrix.chunk }}
    needs: [prepare, install-deps-macos, start-launch-macos]
    if: "!cancelled() && needs.start-launch-macos.result == 'success' && inputs.os == 'macos'"
    runs-on: macos-latest
    strategy:
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.matrix).chunk }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: example
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare.outputs.chunk_size }}
          os_name: macos
          os_config: config_chrome_mac.json
          project_name: ${{ inputs.project_name || 'docsserver' }}
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          clean: ${{ inputs.clean }}
          url: ${{ inputs.url == 'kim' && secrets.URL_RELEASE || secrets.URL_HOTFIX }}

  finish-launch-macos:
    name: Finish macOS Launch
    needs: [prepare, start-launch-macos, run-tests-macos]
    runs-on: ubuntu-latest
    if: "always() && needs.start-launch-macos.result == 'success'"
    outputs:
      rp_launch_url: ${{ steps.finish.outputs.rp_launch_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Finish launch
        id: finish
        uses: ./.github/actions/rp-finish-launch
        with:
          provider: example
          os_name: macos
          project_name: ${{ inputs.project_name || 'docsserver' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          read_pat: ${{ secrets.READ_PAT }}
          branch: ${{ needs.prepare.outputs.branch }}
          analyze: ${{ inputs.analyze }}

  final-summary-windows:
    name: Windows Test Summary
    needs: [prepare, finish-launch-windows]
    runs-on: ubuntu-latest
    if: "!cancelled() && inputs.os == 'windows'"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Collect Windows chunk jobs info
        id: collect-chunks
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          JOBS_JSON=$(gh run view ${{ github.run_id }} --json jobs | jq '.jobs')

          CHUNKS=$(echo "$JOBS_JSON" | jq -r '[.[] | select(.name | startswith("Windows - Chunk"))] | map({name: .name, status: .status, conclusion: .conclusion, id: .databaseId, url: .url}) | @json')
          echo "chunks=$CHUNKS" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PAT }}

      - name: Send comprehensive Telegram notification
        if: ${{ always() && inputs.notify }}
        shell: bash
        env:
          CHUNKS_JSON: ${{ steps.collect-chunks.outputs.chunks }}
          RP_URL: ${{ needs.finish-launch-windows.outputs.rp_launch_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          FAILED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "failure")] | length')
          CANCELLED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "cancelled")] | length')
          SUCCESS_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')
          TOTAL_COUNT=$(echo "$CHUNKS_JSON" | jq 'length')

          # Report to Telegram only when something is not green; skip on a clean full pass.
          if [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" && "$TOTAL_COUNT" -gt 0 ]]; then
            echo "All chunks passed - skipping Telegram notification"
            exit 0
          fi

          if [[ "$TOTAL_COUNT" -eq 0 ]]; then
            OVERALL_STATUS="❌ Tests did not run - an upstream job failed"
          elif [[ "$FAILED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="❌ Chunks failed (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$CANCELLED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="🚫 Some chunks cancelled (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" ]] && [[ "$TOTAL_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="✅ All chunks passed (${TOTAL_COUNT}/${TOTAL_COUNT})"
          else
            OVERALL_STATUS="❓ Chunks status unknown"
          fi

          MESSAGE="${MESSAGE}\n*Workflow:* ${{ github.workflow }}"
          MESSAGE="${MESSAGE}\n*Provider:* example"
          MESSAGE="${MESSAGE}\n*Platform:* windows"
          MESSAGE="${MESSAGE}\n*Browser:* chrome"
          MESSAGE="${MESSAGE}\n*Branch:* ${{ needs.prepare.outputs.branch }}"
          MESSAGE="${MESSAGE}\n*Stand:* ${{ github.event.inputs.url }}"
          MESSAGE="${MESSAGE}\n*Status:* ${OVERALL_STATUS}"
          MESSAGE="${MESSAGE}\n"

          MESSAGE="${MESSAGE}\n[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          if [[ -n "$RP_URL" ]]; then
            MESSAGE="${MESSAGE}\n[View Report Portal](${RP_URL})"
          fi

          MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TELEGRAM_TO}\",
              \"text\": \"$MESSAGE\",
              \"parse_mode\": \"Markdown\",
              \"disable_notification\": true,
              \"disable_web_page_preview\": true
            }"

  final-summary-linux:
    name: Linux Test Summary
    needs: [prepare, finish-launch-linux]
    runs-on: ubuntu-latest
    if: "!cancelled() && inputs.os == 'linux'"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Collect Linux chunk jobs info
        id: collect-chunks
        if: always()
        continue-on-error: true
        shell: bash
        run: |
