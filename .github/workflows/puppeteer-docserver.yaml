          echo "chunks=$CHUNKS" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PAT }}

      - name: Send comprehensive Telegram notification
        if: ${{ always() && inputs.notify }}
        shell: bash
        env:
          CHUNKS_JSON: ${{ steps.collect-chunks.outputs.chunks }}
          RP_URL: ${{ needs.finish-launch-linux.outputs.rp_launch_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          FAILED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "failure")] | length')
          CANCELLED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "cancelled")] | length')
          SUCCESS_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')
          TOTAL_COUNT=$(echo "$CHUNKS_JSON" | jq 'length')

          # Report to Telegram only when something is not green; skip on a clean full pass.
          if [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" && "$TOTAL_COUNT" -gt 0 ]]; then
            echo "All chunks passed - skipping Telegram notification"
            exit 0
          fi

          if [[ "$TOTAL_COUNT" -eq 0 ]]; then
            OVERALL_STATUS="❌ Tests did not run - an upstream job failed"
          elif [[ "$FAILED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="❌ Chunks failed (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$CANCELLED_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="🚫 Some chunks cancelled (${SUCCESS_COUNT}/${TOTAL_COUNT} passed)"
          elif [[ "$SUCCESS_COUNT" -eq "$TOTAL_COUNT" ]] && [[ "$TOTAL_COUNT" -gt 0 ]]; then
            OVERALL_STATUS="✅ All chunks passed (${TOTAL_COUNT}/${TOTAL_COUNT})"
          else
            OVERALL_STATUS="❓ Chunks status unknown"
          fi

          MESSAGE="${MESSAGE}\n*Workflow:* ${{ github.workflow }}"
          MESSAGE="${MESSAGE}\n*Provider:* example"
          MESSAGE="${MESSAGE}\n*Platform:* linux"
          MESSAGE="${MESSAGE}\n*Browser:* chrome"
          MESSAGE="${MESSAGE}\n*Branch:* ${{ needs.prepare.outputs.branch }}"
          MESSAGE="${MESSAGE}\n*Stand:* ${{ github.event.inputs.url }}"
          MESSAGE="${MESSAGE}\n*Status:* ${OVERALL_STATUS}"
          MESSAGE="${MESSAGE}\n"

          MESSAGE="${MESSAGE}\n[View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          if [[ -n "$RP_URL" ]]; then
            MESSAGE="${MESSAGE}\n[View Report Portal](${RP_URL})"
          fi

          MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g')

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TELEGRAM_TO}\",
              \"text\": \"$MESSAGE\",
              \"parse_mode\": \"Markdown\",
              \"disable_notification\": true,
              \"disable_web_page_preview\": true
            }"

  final-summary-macos:
    name: macOS Test Summary
    needs: [prepare, finish-launch-macos]
    runs-on: ubuntu-latest
    if: "!cancelled() && inputs.os == 'macos'"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Collect macOS chunk jobs info
        id: collect-chunks
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          JOBS_JSON=$(gh run view ${{ github.run_id }} --json jobs | jq '.jobs')

          CHUNKS=$(echo "$JOBS_JSON" | jq -r '[.[] | select(.name | startswith("macOS - Chunk"))] | map({name: .name, status: .status, conclusion: .conclusion, id: .databaseId, url: .url}) | @json')
          echo "chunks=$CHUNKS" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PAT }}

      - name: Send comprehensive Telegram notification
        if: ${{ always() && inputs.notify }}
        shell: bash
        env:
          CHUNKS_JSON: ${{ steps.collect-chunks.outputs.chunks }}
          RP_URL: ${{ needs.finish-launch-macos.outputs.rp_launch_url }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          FAILED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "failure")] | length')
          CANCELLED_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "cancelled")] | length')
          SUCCESS_COUNT=$(echo "$CHUNKS_JSON" | jq '[.[] | select(.conclusion == "success")] | length')
          TOTAL_COUNT=$(echo "$CHUNKS_JSON" | jq 'length')

