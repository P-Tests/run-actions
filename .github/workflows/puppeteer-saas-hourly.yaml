name: Puppeteer SaaS Hourly Tests

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to run on'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      test_path:
        description: 'Specific test file or directory'
        required: false
        default: ''
        type: string
      chunk_size:
        description: 'Tests per parallel chunk'
        required: false
        default: '100'
        type: string
      clean:
        description: 'Clear test files from the remote server after all chunks'
        required: false
        default: true
        type: boolean
      project_name:
        description: 'ReportPortal project name'
        required: false
        default: 'docspace-saas'
        type: string
      launch_name:
        description: 'ReportPortal launch name'
        required: false
        default: ''
        type: string
      api_key:
        description: 'ReportPortal API key'
        required: false
        default: ''
        type: string

concurrency:
  group: puppeteer-stands
  cancel-in-progress: false

jobs:
  branch-config:
    name: Resolve branches
    runs-on: ubuntu-latest
    outputs:
      docspaceEU: ${{ steps.resolve.outputs.docspaceEU }}
      docspaceUS: ${{ steps.resolve.outputs.docspaceUS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Resolve Dep.Tests branches
        id: resolve
        shell: bash
        run: |
          for p in docspaceEU docspaceUS; do
            V=$(jq -r --arg p "$p" '.providers[$p] // "master"' .github/branches.json)
            echo "$p -> $V"
            echo "$p=$V" >> "$GITHUB_OUTPUT"
          done

  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        env:
          OS_INPUT: ${{ inputs.os }}
        run: |
          OS="$OS_INPUT"
          if [ -z "$OS" ] || [ "$OS" == "all" ]; then
            echo 'matrix={"os":[{"name":"windows","runner":"windows-latest","config":"win"},{"name":"linux","runner":"ubuntu-latest","config":"linux"},{"name":"macos","runner":"macos-latest","config":"mac"}]}' >> $GITHUB_OUTPUT
          elif [ "$OS" == "windows" ]; then
            echo 'matrix={"os":[{"name":"windows","runner":"windows-latest","config":"win"}]}' >> $GITHUB_OUTPUT
          elif [ "$OS" == "linux" ]; then
            echo 'matrix={"os":[{"name":"linux","runner":"ubuntu-latest","config":"linux"}]}' >> $GITHUB_OUTPUT
          elif [ "$OS" == "macos" ]; then
            echo 'matrix={"os":[{"name":"macos","runner":"macos-latest","config":"mac"}]}' >> $GITHUB_OUTPUT
          fi

  install-deps:
    name: Install dependencies - ${{ matrix.os.name }}
    needs: [setup]
    continue-on-error: true
    runs-on: ${{ matrix.os.runner }}
    strategy:
      matrix:
        os: ${{ fromJson(needs.setup.outputs.matrix).os }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies and populate caches
        uses: ./.github/actions/puppeteer-install-deps
        with:
          read_pat: ${{ secrets.READ_PAT }}

  prepare-docspaceEU:
    name: Prepare - DocSpace EU
    needs: [setup, branch-config]
    runs-on: ubuntu-latest
    outputs:
      os_matrix: ${{ needs.setup.outputs.matrix }}
      branch: ${{ needs.branch-config.outputs.docspaceEU }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      num_chunks: ${{ steps.prepare.outputs.num_chunks }}
      chunk_size: ${{ steps.prepare.outputs.chunk_size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Prepare test matrix
        id: prepare
        uses: ./.github/actions/puppeteer-prepare
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'hourly' || '' }}
          chunk_size: ${{ inputs.chunk_size || '100' }}
          branch: ${{ needs.branch-config.outputs.docspaceEU }}
          read_pat: ${{ secrets.READ_PAT }}
          test_path: ${{ inputs.test_path }}

  run-docspaceEU:
    name: DocSpace EU - ${{ matrix.os.name }} - Chunk ${{ matrix.chunk }}
    needs: [prepare-docspaceEU, install-deps]
    if: ${{ !cancelled() && needs.prepare-docspaceEU.result == 'success' }}
    runs-on: ${{ matrix.os.runner }}
    strategy:
      matrix:
        os: ${{ fromJson(needs.prepare-docspaceEU.outputs.os_matrix).os }}
        chunk: ${{ fromJson(needs.prepare-docspaceEU.outputs.matrix).chunk }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: docspaceEU
          suite: ${{ inputs.test_path == '' && 'hourly' || '' }}
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare-docspaceEU.outputs.chunk_size }}
          num_chunks: ${{ needs.prepare-docspaceEU.outputs.num_chunks }}
          os_name: ${{ matrix.os.name }}
          os_config: config_chrome_${{ matrix.os.config }}.json
          project_name: ${{ inputs.project_name || 'docspace-saas' }}
          launch_name: "${{ inputs.launch_name || format('Hourly Tests - docspaceEU{0}', needs.prepare-docspaceEU.outputs.num_chunks > 1 && format(' - Chunk {0}', matrix.chunk) || '') }}"
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          clean: false

  post-docspaceEU-windows:
    name: Post - DocSpace EU - windows
    needs: [prepare-docspaceEU, run-docspaceEU]
    if: ${{ !cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Report DocSpace EU - windows
        uses: ./.github/actions/puppeteer-post
        with:
          provider: docspaceEU
          os_name: windows
          job_name_prefix: 'DocSpace EU'
          num_chunks: ${{ needs.prepare-docspaceEU.outputs.num_chunks }}
          launch_name: Hourly Tests - docspaceEU
          project_name: ${{ inputs.project_name || 'docspace-saas' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}

  post-docspaceEU-linux:
    name: Post - DocSpace EU - linux
    needs: [prepare-docspaceEU, run-docspaceEU]
    if: ${{ !cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Report DocSpace EU - linux
        uses: ./.github/actions/puppeteer-post
        with:
          provider: docspaceEU
          os_name: linux
          job_name_prefix: 'DocSpace EU'
          num_chunks: ${{ needs.prepare-docspaceEU.outputs.num_chunks }}
          launch_name: Hourly Tests - docspaceEU
          project_name: ${{ inputs.project_name || 'docspace-saas' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}

  post-docspaceEU-macos:
    name: Post - DocSpace EU - macos
    needs: [prepare-docspaceEU, run-docspaceEU]
    if: ${{ !cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Report DocSpace EU - macos
        uses: ./.github/actions/puppeteer-post
        with:
          provider: docspaceEU
          os_name: macos
          job_name_prefix: 'DocSpace EU'
          num_chunks: ${{ needs.prepare-docspaceEU.outputs.num_chunks }}
          launch_name: Hourly Tests - docspaceEU
          project_name: ${{ inputs.project_name || 'docspace-saas' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}


  prepare-docspaceUS:
    name: Prepare - DocSpace US
    needs: [setup, branch-config]
    runs-on: ubuntu-latest
    outputs:
      os_matrix: ${{ needs.setup.outputs.matrix }}
      branch: ${{ needs.branch-config.outputs.docspaceUS }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      num_chunks: ${{ steps.prepare.outputs.num_chunks }}
      chunk_size: ${{ steps.prepare.outputs.chunk_size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Prepare test matrix
        id: prepare
        uses: ./.github/actions/puppeteer-prepare
        with:
          provider: docspaceUS
          suite: ${{ inputs.test_path == '' && 'hourly' || '' }}
          chunk_size: ${{ inputs.chunk_size || '100' }}
          branch: ${{ needs.branch-config.outputs.docspaceUS }}
          read_pat: ${{ secrets.READ_PAT }}
          test_path: ${{ inputs.test_path }}

  run-docspaceUS:
    name: DocSpace US - ${{ matrix.os.name }} - Chunk ${{ matrix.chunk }}
    needs: [prepare-docspaceUS, install-deps]
    if: ${{ !cancelled() && needs.prepare-docspaceUS.result == 'success' }}
    runs-on: ${{ matrix.os.runner }}
    strategy:
      matrix:
        os: ${{ fromJson(needs.prepare-docspaceUS.outputs.os_matrix).os }}
        chunk: ${{ fromJson(needs.prepare-docspaceUS.outputs.matrix).chunk }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run tests
        uses: ./.github/actions/puppeteer-run-chunk
        with:
          provider: docspaceUS
          suite: ${{ inputs.test_path == '' && 'hourly' || '' }}
          chunk_id: ${{ matrix.chunk }}
          chunk_size: ${{ needs.prepare-docspaceUS.outputs.chunk_size }}
          num_chunks: ${{ needs.prepare-docspaceUS.outputs.num_chunks }}
          os_name: ${{ matrix.os.name }}
          os_config: config_chrome_${{ matrix.os.config }}.json
          project_name: ${{ inputs.project_name || 'docspace-saas' }}
          launch_name: "${{ inputs.launch_name || format('Hourly Tests - docspaceUS{0}', needs.prepare-docspaceUS.outputs.num_chunks > 1 && format(' - Chunk {0}', matrix.chunk) || '') }}"
          read_pat: ${{ secrets.READ_PAT }}
          report_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceUS.outputs.branch }}
          test_path: ${{ inputs.test_path }}
          clean: false

  post-docspaceUS-windows:
    name: Post - DocSpace US - windows
    needs: [prepare-docspaceUS, run-docspaceUS]
    if: ${{ !cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Report DocSpace US - windows
        uses: ./.github/actions/puppeteer-post
        with:
          provider: docspaceUS
          os_name: windows
          job_name_prefix: 'DocSpace US'
          num_chunks: ${{ needs.prepare-docspaceUS.outputs.num_chunks }}
          launch_name: Hourly Tests - docspaceUS
          project_name: ${{ inputs.project_name || 'docspace-saas' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceUS.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}

  post-docspaceUS-linux:
    name: Post - DocSpace US - linux
    needs: [prepare-docspaceUS, run-docspaceUS]
    if: ${{ !cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'linux') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Report DocSpace US - linux
        uses: ./.github/actions/puppeteer-post
        with:
          provider: docspaceUS
          os_name: linux
          job_name_prefix: 'DocSpace US'
          num_chunks: ${{ needs.prepare-docspaceUS.outputs.num_chunks }}
          launch_name: Hourly Tests - docspaceUS
          project_name: ${{ inputs.project_name || 'docspace-saas' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceUS.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}

  post-docspaceUS-macos:
    name: Post - DocSpace US - macos
    needs: [prepare-docspaceUS, run-docspaceUS]
    if: ${{ !cancelled() && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'macos') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Report DocSpace US - macos
        uses: ./.github/actions/puppeteer-post
        with:
          provider: docspaceUS
          os_name: macos
          job_name_prefix: 'DocSpace US'
          num_chunks: ${{ needs.prepare-docspaceUS.outputs.num_chunks }}
          launch_name: Hourly Tests - docspaceUS
          project_name: ${{ inputs.project_name || 'docspace-saas' }}
          api_key: ${{ inputs.api_key || secrets.REPORT_KEY }}
          branch: ${{ needs.prepare-docspaceUS.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
          telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_TO }}


  clean-docspaceEU:
    name: Clean - DocSpace EU
    needs: [prepare-docspaceEU, post-docspaceEU-windows, post-docspaceEU-linux, post-docspaceEU-macos]
    if: ${{ !cancelled() && needs.prepare-docspaceEU.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.clean }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Clear remote test files
        uses: ./.github/actions/puppeteer-clean
        with:
          provider: docspaceEU
          branch: ${{ needs.prepare-docspaceEU.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}

  clean-docspaceUS:
    name: Clean - DocSpace US
    needs: [prepare-docspaceUS, post-docspaceUS-windows, post-docspaceUS-linux, post-docspaceUS-macos]
    if: ${{ !cancelled() && needs.prepare-docspaceUS.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.clean }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Clear remote test files
        uses: ./.github/actions/puppeteer-clean
        with:
          provider: docspaceUS
          branch: ${{ needs.prepare-docspaceUS.outputs.branch }}
          read_pat: ${{ secrets.READ_PAT }}
